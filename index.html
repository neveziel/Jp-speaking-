<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日本語スピーキング">
<meta name="description" content="일본어 회화 스피킹 훈련 — Lv.1 최신 유행어부터 Lv.5 마음속 깊은 대화까지, 뜻만 보고 말하고 원어민 음성으로 쉐도잉하는 훈련 앱">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>일본어 스피킹 훈련소</title>
<style>
:root{
  --bg:#f5f7f6; --card:#fff; --ink:#12211f; --sub:#61706d; --line:#e3e9e7;
  --ac:#1f7a6d; --ac2:#0f9d84; --acSoft:#e5f3f0;
  --gold:#b7791f; --goldSoft:#fdf3e0;
  --pink:#c2406c; --pinkSoft:#fdebf2;
  --blue:#2b5fa8; --blueSoft:#e8f0fb;
  --r:18px; --sh:0 1px 2px rgba(16,40,36,.05),0 8px 24px rgba(16,40,36,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1413; --card:#161f1e; --ink:#e8f1ef; --sub:#93a5a1; --line:#243230;
    --ac:#54c9b3; --ac2:#3fd0b0; --acSoft:#122b28;
    --gold:#e0ae5e; --goldSoft:#2a2317;
    --pink:#f78bab; --pinkSoft:#2c1a22;
    --blue:#8ab4f0; --blueSoft:#182434;
    --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
body.tab-card{padding-bottom:calc(158px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
.jp{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",-apple-system,sans-serif;letter-spacing:.01em}
ruby{ruby-align:center;ruby-position:over}
rt{font-size:.5em;line-height:1.1;font-weight:400;color:var(--sub);letter-spacing:0}
body.nofuri rt{display:none}

/* ── header (slim) ── */
header{
  position:sticky;top:0;z-index:40;
  padding:calc(6px + env(safe-area-inset-top)) 12px 0;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;gap:8px;height:34px}
.htitle{font-size:15px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.htitle em{font-style:normal;font-size:10px;font-weight:600;color:var(--sub);margin-left:4px;letter-spacing:0}
.hlv{padding:2px 8px;border-radius:99px;background:var(--acSoft);color:var(--ac);font-size:10.5px;font-weight:800}
.hprog{margin-left:auto;font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.hprog b{color:var(--ac);font-size:12px}
.ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.ico.on{background:var(--acSoft);border-color:var(--ac);color:var(--ac)}
.hbar{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 0}
.hbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}

/* ── layout ── */
main{padding:11px 13px 8px;max-width:600px;margin:0 auto}
.tab{display:none}
.tab.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
.badge{padding:2px 8px;border-radius:99px;font-weight:800;font-size:10.5px;letter-spacing:.02em}
.b-lv{background:var(--acSoft);color:var(--ac)}
.b-tag{background:var(--goldSoft);color:var(--gold)}
.b-pol{background:var(--blueSoft);color:var(--blue)}
.b-cas{background:var(--pinkSoft);color:var(--pink)}
.idx{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}

/* ── speaking card ── */
.qcard{padding:0;overflow:hidden}
.qcard.done{border-color:var(--ac2)}
.chead{display:flex;align-items:center;gap:5px;padding:10px 10px 0}
.chead .sp{flex:1}
.qbody{padding:6px 18px 16px}
.qcard.tapable .qbody{cursor:pointer}
.qko{font-size:25px;font-weight:800;line-height:1.42;letter-spacing:-.6px;margin:16px 0 8px}
.qtip{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.qtip:after{content:"";flex:1;height:1px;background:var(--line)}
.answer{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;animation:fade .2s}
.ajp{font-size:23px;font-weight:700;line-height:2.05}
.akana{font-size:12.5px;color:var(--sub);margin-top:6px}
.aroma{font-size:11.5px;color:var(--sub);font-style:italic;margin-top:2px}
.note{font-size:12.5px;color:var(--sub);margin-top:9px;background:var(--acSoft);border-radius:11px;padding:9px 11px;line-height:1.6}
.ex{margin-top:10px;border-radius:12px;padding:10px 11px;background:color-mix(in srgb,var(--card) 92%,var(--line));border:1px solid var(--line)}
.ex .ej{font-size:15px;font-weight:600;line-height:2.0}
.ex .ek{font-size:11.5px;color:var(--sub);margin-top:3px}
.explay{margin-top:6px;font-size:11.5px;font-weight:800;color:var(--ac);padding:4px 0}
.recbar{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);min-height:18px}
.recbar button{font-size:11.5px;font-weight:800;color:var(--ac)}
.reveal{margin-top:18px;width:100%;padding:15px;border-radius:14px;background:var(--ac);color:#fff;font-size:15px;font-weight:800;letter-spacing:-.2px}
@media (prefers-color-scheme: dark){.reveal{color:#08110f}}
.reveal small{display:block;font-size:10.5px;font-weight:600;opacity:.8;margin-top:2px}

/* ── thumb remote ── */
.remote{
  position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:35;
  display:none;gap:7px;padding:8px 10px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
}
body.tab-card .remote{display:flex}
.rbtn{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:9px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-size:10.5px;font-weight:800;color:var(--sub);line-height:1.2;
}
.rbtn i{font-style:normal;font-size:19px;line-height:1.15}
.rbtn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme: dark){.rbtn.pri{color:#08110f}}
.rbtn.on{background:var(--acSoft);border-color:var(--ac);color:var(--ac)}
.rbtn.rec.on{background:var(--pink);border-color:var(--pink);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.62}}

/* ── settings sheet ── */
.sheetWrap{position:fixed;inset:0;z-index:70;display:none}
.sheetWrap.on{display:block}
.sheetBack{position:absolute;inset:0;background:rgba(8,18,16,.42)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--card);
  border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;box-shadow:0 -8px 32px rgba(0,0,0,.22);animation:up .22s ease;
}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;margin-bottom:12px}
.sh b{font-size:15px}
.sh button{margin-left:auto;font-size:16px;color:var(--sub);padding:4px 8px}
.search{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);outline:none;min-width:0}
.srow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.srow .sw{margin-left:auto}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);flex:0 0 auto;transition:background .18s;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .18s}
.sw.on{background:var(--ac2)}
.sw.on i{left:21px}
.slabel{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin:16px 0 8px;text-transform:uppercase}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--sub)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme: dark){.chip.on{color:#08110f}}
.rate{display:flex;gap:6px}
.rate button{flex:1;padding:11px 0;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--sub)}
.rate button.on{background:var(--acSoft);border-color:var(--ac);color:var(--ac)}
.sfoot{margin-top:16px;font-size:11.5px;color:var(--sub);line-height:1.7}

/* ── roleplay ── */
.dlist{display:flex;flex-direction:column;gap:9px}
.ditem{padding:13px 14px;display:flex;align-items:center;gap:11px}
.ditem .dt{font-size:15px;font-weight:800;line-height:1.45}
.ditem .ds{font-size:11.5px;color:var(--sub);margin-top:3px}
.ditem .arw{margin-left:auto;color:var(--sub);font-size:17px}
.dnum{flex:0 0 auto;width:30px;height:30px;border-radius:10px;background:var(--acSoft);color:var(--ac);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.chat{padding:12px 12px 6px}
.line{display:flex;gap:8px;margin-bottom:11px;align-items:flex-start}
.line.B{flex-direction:row-reverse}
.ava{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--acSoft);color:var(--ac);margin-top:2px}
.line.B .ava{background:var(--goldSoft);color:var(--gold)}
.bub{max-width:82%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.line.B .bub{background:var(--acSoft);border-color:transparent}
.bub .lj{font-size:16px;font-weight:600;line-height:2.0}
.bub .lk{font-size:11.5px;color:var(--sub);margin-top:3px}
.bub .ln{font-size:11px;color:var(--sub);margin-top:5px;opacity:.85}
.bub .bplay{font-size:11.5px;font-weight:800;color:var(--ac);margin-top:6px}
.bturn{border:1px dashed var(--ac);background:var(--card)}
.bturn .hint{font-size:13px;font-weight:700;color:var(--ink)}
.bturn .say{font-size:11px;color:var(--sub);margin-top:3px}
.line.playing .bub{outline:2px solid var(--ac);outline-offset:1px}

/* ── drill ── */
.drilltop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pdots{display:flex;gap:3px;flex:1}
.pdots i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.pdots i.on{background:var(--ac)}
.pdots i.cur{background:var(--ac2);opacity:.55}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme: dark){.btn.pri{color:#08110f}}
.btn.ghost{background:none}
.btn.on{background:var(--acSoft);border-color:var(--ac);color:var(--ac)}
.krow{display:flex;gap:7px;margin-top:12px}
.krow .btn{flex:1;justify-content:center}

/* ── tips ── */
.tips h3{font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.04em;margin:18px 0 7px;text-transform:uppercase}
.mitem{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.mitem:last-child{border-bottom:0}
.mnum{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mitem b{display:block;font-size:13.5px}
.mitem p{margin:3px 0 0;font-size:12.5px;color:var(--sub);line-height:1.62}
.tip{padding:12px 0;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip b{font-size:13.5px}
.tip p{margin:4px 0 0;font-size:12.5px;color:var(--sub);line-height:1.62}
.tip a{font-size:11px;color:var(--ac);text-decoration:none;display:inline-block;margin-top:5px}
.warn{font-size:12px;color:var(--sub);line-height:1.62;padding:11px 0;border-bottom:1px dashed var(--line)}
.srcline{display:flex;gap:8px;font-size:11.5px;color:var(--sub);padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.srcline b{flex:0 0 auto;font-size:10.5px;background:var(--acSoft);color:var(--ac);padding:1px 6px;border-radius:6px}
.srcline a{color:var(--sub);text-decoration:none;word-break:break-all}

/* ── bottom nav ── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:5px 6px calc(5px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;color:var(--sub);font-size:10px;font-weight:700}
nav button i{font-style:normal;font-size:17px;line-height:1.15}
nav button.on{color:var(--ac)}
nav button.on i{transform:translateY(-1px)}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:rgba(18,33,31,.94);color:#fff;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:38px 20px;line-height:1.7}
h2.sec{font-size:14px;margin:2px 0 9px;display:flex;align-items:center;gap:7px}
h2.sec small{font-size:11px;font-weight:600;color:var(--sub)}
.linkback{font-size:12.5px;font-weight:700;color:var(--ac);padding:6px 0;display:inline-block}
</style>
</head>
<body class="tab-card">
<header>
  <div class="hrow">
    <div class="htitle">일본어 스피킹<em>日本語</em></div>
    <span class="hlv" id="hlv">전체</span>
    <div class="hprog"><b id="doneN">0</b><span id="doneT">/141</span></div>
    <button class="ico" id="setBtn" aria-label="설정">⚙️</button>
  </div>
  <div class="hbar"><i id="hbar"></i></div>
</header>

<main>
  <section class="tab on" id="tab-card"><div id="deck"></div></section>
  <section class="tab" id="tab-role"><div id="roleList"></div><div id="roleView" style="display:none"></div></section>
  <section class="tab" id="tab-drill"><div id="drillWrap"></div></section>
  <section class="tab" id="tab-saved"><div id="savedWrap"></div></section>
  <section class="tab" id="tab-tips"><div class="tips" id="tipsWrap"></div></section>
</main>

<div class="remote" id="remote">
  <button class="rbtn" id="rListen"><i>🔊</i><span id="rListenLbl">1.2x 듣기</span></button>
  <button class="rbtn" id="rLoop"><i>🔁</i><span id="rLoopLbl">따라말하기</span></button>
  <button class="rbtn rec" id="rRec"><i>🎙️</i><span id="rRecLbl">녹음/비교</span></button>
  <button class="rbtn pri" id="rNext"><i>→</i><span>다음</span></button>
</div>

<nav>
  <button class="on" data-tab="card"><i>🎙️</i>카드</button>
  <button data-tab="role"><i>💬</i>롤플레이</button>
  <button data-tab="drill"><i>⚡</i>드릴</button>
  <button data-tab="saved"><i>⭐</i>저장함</button>
  <button data-tab="tips"><i>💡</i>팁</button>
</nav>

<div class="sheetWrap" id="sheetWrap">
  <div class="sheetBack" id="sheetBack"></div>
  <div class="sheet">
    <div class="sh"><b>설정</b><button id="sheetClose">✕</button></div>
    <div class="search"><span>🔍</span><input id="q" placeholder="한국어·일본어·태그 검색" autocomplete="off"></div>
    <div class="srow"><span>후리가나 (ふりがな)</span><button class="sw on" id="furiSw"><i></i></button></div>
    <div class="srow"><span>반말 / 정중체 배지</span><button class="sw on" id="polSw"><i></i></button></div>
    <div class="slabel">레벨</div>
    <div class="chips" id="lvchips"></div>
    <div class="slabel">재생 속도</div>
    <div class="rate" id="rateBox"></div>
    <div class="sfoot" id="sfoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var DATA = {"phrases":[{"id":"L1-01","lv":1,"tag":"공감","pol":"casual","v":"f","jp":"それな！","ruby":"それな！","kana":"それな！","ko":"그러니까! / 완전 내 말이야","note":"상대 말에 강하게 공감. 친구·동갑 사이 전용. 윗사람에게는 たしかに가 안전.","ex":"それな！本当にそう思う。","exRuby":"それな！<ruby>本当<rt>ほんとう</rt></ruby>にそう<ruby>思<rt>おも</rt></ruby>う。","exKana":"それな！ほんとうにそうおもう。","exKo":"그러니까! 진짜 그렇게 생각해."},{"id":"L1-02","lv":1,"tag":"공감","pol":"casual","v":"m","jp":"たしかに。","ruby":"たしかに。","kana":"たしかに。","ko":"그렇네. / 확실히 그래","note":"무난한 동의. 연상·직장에서도 쓸 수 있는 안전한 공감 표현.","ex":"たしかに。言われてみればそうだね。","exRuby":"たしかに。<ruby>言<rt>い</rt></ruby>われてみればそうだね。","exKana":"たしかに。いわれてみればそうだね。","exKo":"그렇네. 듣고 보니 그러네."},{"id":"L1-03","lv":1,"tag":"놀람","pol":"casual","v":"m","jp":"ガチで？","ruby":"ガチで？","kana":"ガチで？","ko":"진짜로? / 진심?","note":"信じられないときの驚き。マジで보다 조금 더 요즘 말투.","ex":"ガチで？それは初耳だ。","exRuby":"ガチで？それは<ruby>初耳<rt>はつみみ</rt></ruby>だ。","exKana":"ガチで？それははつみみだ。","exKo":"진짜로? 그건 처음 듣는데."},{"id":"L1-04","lv":1,"tag":"놀람","pol":"casual","v":"f","jp":"マジで？","ruby":"マジで？","kana":"マジで？","ko":"진짜? / 정말?","note":"가장 흔한 놀람·확인. 억양을 올리면 의심, 내리면 감탄.","ex":"マジで？信じられない。","exRuby":"マジで？<ruby>信<rt>しん</rt></ruby>じられない。","exKana":"マジで？しんじられない。","exKo":"진짜? 믿을 수가 없어."},{"id":"L1-05","lv":1,"tag":"웃음","pol":"casual","v":"f","jp":"草","ruby":"<ruby>草<rt>くさ</rt></ruby>","kana":"くさ","ko":"ㅋㅋㅋ / 웃기다","note":"www가 풀밭처럼 보인 데서 유래. 대폭소는 大草原. 메시지에서 특히 많이 씀.","ex":"その返しは草。面白すぎる。","exRuby":"その<ruby>返<rt>かえ</rt></ruby>しは<ruby>草<rt>くさ</rt></ruby>。<ruby>面白<rt>おもしろ</rt></ruby>すぎる。","exKana":"そのかえしはくさ。おもしろすぎる。","exKo":"그 대답은 ㅋㅋㅋ. 너무 웃겨."},{"id":"L1-06","lv":1,"tag":"감성","pol":"casual","v":"f","jp":"エモい","ruby":"エモい","kana":"エモい","ko":"감성적이다 / 뭉클하다","note":"emotional에서 유래. 추억·노을·음악에 가슴이 찡할 때. 대상은 분위기·체험.","ex":"この曲、夜に聴くとエモい。","exRuby":"この<ruby>曲<rt>きょく</rt></ruby>、<ruby>夜<rt>よる</rt></ruby>に<ruby>聴<rt>き</rt></ruby>くとエモい。","exKana":"このきょく、よるにきくとエモい。","exKo":"이 곡, 밤에 들으면 뭉클해."},{"id":"L1-07","lv":1,"tag":"감정","pol":"casual","v":"f","jp":"ぴえん","ruby":"ぴえん","kana":"ぴえん","ko":"슬퍼요… / 아쉬워요…","note":"가벼운 슬픔·아쉬움을 귀엽게. 진짜 심각할 때는 がちぴえん.","ex":"好きな店が閉店してぴえん。","exRuby":"<ruby>好<rt>す</rt></ruby>きな<ruby>店<rt>みせ</rt></ruby>が<ruby>閉店<rt>へいてん</rt></ruby>してぴえん。","exKana":"すきなみせがへいてんしてぴえん。","exKo":"좋아하는 가게가 문 닫아서 슬퍼요…"},{"id":"L1-08","lv":1,"tag":"상황","pol":"casual","v":"m","jp":"きまZ","ruby":"きまZ","kana":"きまZ","ko":"어색해 / 분위기 이상해","note":"気まずい(기마즈이)의 약자. 자음만 남긴 표기. 친한 사이에서만.","ex":"沈黙がきまZすぎる。","exRuby":"<ruby>沈黙<rt>ちんもく</rt></ruby>がきまZすぎる。","exKana":"ちんもくがきまZすぎる。","exKo":"정적이 너무 어색해."},{"id":"L1-09","lv":1,"tag":"맞장구","pol":"casual","v":"f","jp":"あーね","ruby":"あーね","kana":"あーね","ko":"아 그렇구나 / 이해했어","note":"ああ、なるほどね의 축약. 100% 공감은 아니어도 부드럽게 넘길 때.","ex":"あーね、じゃあまた今度ね。","exRuby":"あーね、じゃあまた<ruby>今度<rt>こんど</rt></ruby>ね。","exKana":"あーね、じゃあまたこんどね。","exKo":"아 그렇구나, 그럼 다음에 또 보자."},{"id":"L1-10","lv":1,"tag":"메시지","pol":"casual","v":"m","jp":"り","ruby":"り","kana":"り","ko":"ㅇㅋ / 알겠어","note":"了解를 한 글자로. 문자·메신저 전용, 말로는 안 씀.","ex":"り。駅前に十時ね。","exRuby":"り。<ruby>駅前<rt>えきまえ</rt></ruby>に<ruby>十時<rt>じゅうじ</rt></ruby>ね。","exKana":"り。えきまえにじゅうじね。","exKo":"ㅇㅋ. 역 앞에서 10시지."},{"id":"L1-11","lv":1,"tag":"가능성","pol":"casual","v":"m","jp":"ワンチャン","ruby":"ワンチャン","kana":"ワンチャン","ko":"혹시 몰라 / 한 번 노려볼 만","note":"one chance의 축약. 낮은 가능성에 기대를 걸 때.","ex":"今から行けばワンチャン間に合うかも。","exRuby":"<ruby>今<rt>いま</rt></ruby>から<ruby>行<rt>い</rt></ruby>けばワンチャン<ruby>間<rt>ま</rt></ruby>に<ruby>合<rt>あ</rt></ruby>うかも。","exKana":"いまからいけばワンチャンまにあうかも。","exKo":"지금 가면 혹시 시간 맞출 수 있을지도."},{"id":"L1-12","lv":1,"tag":"감정","pol":"casual","v":"f","jp":"しんどい","ruby":"しんどい","kana":"しんどい","ko":"힘들다 / 귀찮다","note":"육체적·정신적 피로 모두. 최근에는 '좀 부담스럽다'는 뜻으로도.","ex":"今日は朝からしんどい。","exRuby":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>朝<rt>あさ</rt></ruby>からしんどい。","exKana":"きょうはあさからしんどい。","exKo":"오늘은 아침부터 힘들어."},{"id":"L1-13","lv":1,"tag":"강조","pol":"casual","v":"m","jp":"エグい","ruby":"エグい","kana":"エグい","ko":"장난 아니다 / 빡세다 / 대박","note":"やばい의 상위 호환. 좋은 쪽으로도 나쁜 쪽으로도 '보통을 넘음'.","ex":"あの量はエグいって。終わらない。","exRuby":"あの<ruby>量<rt>りょう</rt></ruby>はエグいって。<ruby>終<rt>お</rt></ruby>わらない。","exKana":"あのりょうはエグいって。おわらない。","exKo":"저 양은 장난 아냐. 못 끝내."},{"id":"L1-14","lv":1,"tag":"몰입","pol":"casual","v":"f","jp":"沼る","ruby":"<ruby>沼<rt>ぬま</rt></ruby>る","kana":"ぬまる","ko":"푹 빠지다 / 헤어 나올 수 없다","note":"はまる보다 강함. 빠져서 나올 수 없는 상태.","ex":"このゲーム、一度やったら沼るよ。","exRuby":"このゲーム、<ruby>一<rt>いち</rt></ruby><ruby>度<rt>ど</rt></ruby>やったら<ruby>沼<rt>ぬま</rt></ruby>るよ。","exKana":"このゲーム、いちどやったらぬまるよ。","exKo":"이 게임, 한 번 하면 푹 빠져."},{"id":"L1-15","lv":1,"tag":"감성","pol":"casual","v":"f","jp":"チルい","ruby":"チルい","kana":"チルい","ko":"힐링된다 / 여유롭다","note":"chill에서 유래. 카페·음악·휴일의 편안한 분위기.","ex":"このカフェ、雰囲気がチルくていいね。","exRuby":"このカフェ、<ruby>雰囲気<rt>ふんいき</rt></ruby>がチルくていいね。","exKana":"このカフェ、ふんいきがチルくていいね。","exKo":"이 카페, 분위기가 편안해서 좋다."},{"id":"L1-16","lv":1,"tag":"관계","pol":"casual","v":"m","jp":"界隈","ruby":"<ruby>界隈<rt>かいわい</rt></ruby>","kana":"かいわい","ko":"계(界) / 그쪽 커뮤니티","note":"원래는 '일대'라는 뜻. 요즘은 취미·문화로 묶인 느슨한 집단.","ex":"推し活界隈では有名な話だよ。","exRuby":"<ruby>推<rt>お</rt></ruby>し<ruby>活<rt>かつ</rt></ruby><ruby>界隈<rt>かいわい</rt></ruby>では<ruby>有名<rt>ゆうめい</rt></ruby>な<ruby>話<rt>はなし</rt></ruby>だよ。","exKana":"おしかつかいわいではゆうめいなはなしだよ。","exKo":"최애 활동 계에서는 유명한 얘기야."},{"id":"L1-17","lv":1,"tag":"관계","pol":"casual","v":"m","jp":"ガチ勢","ruby":"ガチ<ruby>勢<rt>ぜい</rt></ruby>","kana":"ガチぜい","ko":"진심파 / 덕후","note":"ガチで取り組む勢力. 반대는 가볍게 즐기는 エンジョイ勢.","ex":"彼はこのゲームのガチ勢だから知識がすごい。","exRuby":"<ruby>彼<rt>かれ</rt></ruby>はこのゲームのガチ<ruby>勢<rt>ぜい</rt></ruby>だから<ruby>知識<rt>ちしき</rt></ruby>がすごい。","exKana":"かれはこのゲームのガチぜいだからちしきがすごい。","exKo":"걔는 이 게임 진심파라서 지식이 대단해."},{"id":"L1-18","lv":1,"tag":"강조","pol":"casual","v":"f","jp":"激うま","ruby":"<ruby>激<rt>げき</rt></ruby>うま","kana":"げきうま","ko":"존맛 / 엄청 잘한다","note":"激(げき)+うまい. 2025년 전후로 爆(ばく)을 붙이는 말투도 유행.","ex":"このラーメン激うまだ。毎日食べたい。","exRuby":"このラーメン<ruby>激<rt>げき</rt></ruby>うまだ。<ruby>毎日<rt>まいにち</rt></ruby><ruby>食<rt>た</rt></ruby>べたい。","exKana":"このラーメンげきうまだ。まいにちたべたい。","exKo":"이 라멘 존맛. 매일 먹고 싶어."},{"id":"L1-19","lv":1,"tag":"놀람","pol":"casual","v":"m","jp":"ぱねぇ","ruby":"ぱねぇ","kana":"ぱねぇ","ko":"대박 / 말도 안 돼","note":"半端ない(하ンパない)가 줄어든 말. 놀람과 감탄을 함께 담음.","ex":"一人で全部やったの？ぱねぇな。","exRuby":"<ruby>一人<rt>ひとり</rt></ruby>で<ruby>全部<rt>ぜんぶ</rt></ruby>やったの？ぱねぇな。","exKana":"ひとりでぜんぶやったの？ぱねぇな。","exKo":"혼자 다 한 거야? 대박이다."},{"id":"L1-20","lv":1,"tag":"웃음","pol":"casual","v":"f","jp":"うける","ruby":"うける","kana":"うける","ko":"웃기다 / 빵 터진다","note":"상황 자체가 우스울 때. 笑う보다 가볍고 SNS에서 자주 씀.","ex":"その言い方、うける。","exRuby":"その<ruby>言<rt>い</rt></ruby>い<ruby>方<rt>かた</rt></ruby>、うける。","exKana":"そのいいかた、うける。","exKo":"그 말투 웃기다."},{"id":"L1-21","lv":1,"tag":"감성","pol":"casual","v":"f","jp":"てぇてぇ","ruby":"てぇてぇ","kana":"てぇてぇ","ko":"너무 소중해 / 훈훈하다","note":"尊い(とうとい)의 변형. 좋아하는 대상이 너무 귀하고 훌륭할 때.","ex":"二人の関係、てぇてぇな。","exRuby":"<ruby>二人<rt>ふたり</rt></ruby>の<ruby>関係<rt>かんけい</rt></ruby>、てぇてぇな。","exKana":"ふたりのかんけい、てぇてぇな。","exKo":"두 사람의 관계, 너무 훈훈하다."},{"id":"L1-22","lv":1,"tag":"관계","pol":"casual","v":"f","jp":"推し","ruby":"<ruby>推<rt>お</rt></ruby>し","kana":"おし","ko":"최애","note":"내가 응원하는 대상. 推し活(응원 활동), 推しカフェ 등으로 확장.","ex":"今の推しは誰？","exRuby":"<ruby>今<rt>いま</rt></ruby>の<ruby>推<rt>お</rt></ruby>しは<ruby>誰<rt>だれ</rt></ruby>？","exKana":"いまのおしはだれ？","exKo":"지금 최애는 누구야?"},{"id":"L1-23","lv":1,"tag":"상황","pol":"casual","v":"m","jp":"バグる","ruby":"バグる","kana":"バグる","ko":"오류 나다 / 정신이 뒤죽박죽","note":"원래는 프로그램 오류. 사람이 당황해 엉망이 될 때도 씀.","ex":"寝不足で頭がバグってる。","exRuby":"<ruby>寝不足<rt>ねぶそく</rt></ruby>で<ruby>頭<rt>あたま</rt></ruby>がバグってる。","exKana":"ねぶそくであたまがバグってる。","exKo":"잠이 부족해서 머리가 오류 났어."},{"id":"L1-24","lv":1,"tag":"최고","pol":"casual","v":"f","jp":"〇〇しか勝たん","ruby":"<ruby>〇〇<rt>まるまる</rt></ruby>しか<ruby>勝<rt>か</rt></ruby>たん","kana":"まるまるしかかたん","ko":"○○가 최고야","note":"'○○以外에 승자는 없다'. 최애·음식 찬양에 씀.","ex":"休日の朝は珈琲しか勝たん。","exRuby":"<ruby>休日<rt>きゅうじつ</rt></ruby>の<ruby>朝<rt>あさ</rt></ruby>は<ruby>珈琲<rt>こーひー</rt></ruby>しか<ruby>勝<rt>か</rt></ruby>たん。","exKana":"きゅうじつのあさはこーひーしかかたん。","exKo":"휴일 아침엔 커피가 최고지."},{"id":"L1-25","lv":1,"tag":"연애","pol":"casual","v":"f","jp":"蛙化現象","ruby":"<ruby>蛙化<rt>かえるか</rt></ruby><ruby>現象<rt>げんしょう</rt></ruby>","kana":"かえるかげんしょう","ko":"호감이 갑자기 식는 현상","note":"좋아하던 상대의 사소한 행동에 갑자기 정이 떨어지는 것.","ex":"好きだったのに、急に蛙化した。","exRuby":"<ruby>好<rt>す</rt></ruby>きだったのに、<ruby>急<rt>きゅう</rt></ruby>に<ruby>蛙化<rt>かえるか</rt></ruby>した。","exKana":"すきだったのに、きゅうにかえるかした。","exKo":"좋아했는데 갑자기 정이 확 식었어."},{"id":"L1-26","lv":1,"tag":"반전","pol":"casual","v":"m","jp":"逆にいい","ruby":"<ruby>逆<rt>ぎゃく</rt></ruby>にいい","kana":"ぎゃくにいい","ko":"오히려 좋아","note":"예상 밖의 결과를 긍정으로 바꾸는 말. 실패도 웃어넘길 때.","ex":"雨だけど、逆にいい。人が少ないから。","exRuby":"<ruby>雨<rt>あめ</rt></ruby>だけど、<ruby>逆<rt>ぎゃく</rt></ruby>にいい。<ruby>人<rt>ひと</rt></ruby>が<ruby>少<rt>すく</rt></ruby>ないから。","exKana":"あめだけど、ぎゃくにいい。ひとがすくないから。","exKo":"비 오지만 오히려 좋아. 사람이 적으니까."},{"id":"L2-01","lv":2,"tag":"인사","pol":"polite","v":"m","jp":"おはようございます。","ruby":"おはようございます。","kana":"おはようございます。","ko":"안녕하세요 (아침)","note":"직장·가게에서는 하루 종일 쓰기도 함. 친구끼리는 おはよう.","ex":"おはようございます。いい天気ですね。","exRuby":"おはようございます。いい<ruby>天気<rt>てんき</rt></ruby>ですね。","exKana":"おはようございます。いいてんきですね。","exKo":"안녕하세요. 날씨 좋네요."},{"id":"L2-02","lv":2,"tag":"말걸기","pol":"polite","v":"f","jp":"すみません、ちょっといいですか。","ruby":"すみません、ちょっといいですか。","kana":"すみません、ちょっといいですか。","ko":"저기요, 잠깐 괜찮으세요?","note":"모르는 사람에게 말을 걸 때의 기본. すみませんが最も無難.","ex":"すみません、ちょっといいですか。駅への道を伺いたいんですが。","exRuby":"すみません、ちょっといいですか。<ruby>駅<rt>えき</rt></ruby>への<ruby>道<rt>みち</rt></ruby>を<ruby>伺<rt>うかが</rt></ruby>いたいんですが。","exKana":"すみません、ちょっといいですか。えきへのみちをうかがいたいんですが。","exKo":"저기요, 잠깐 괜찮으세요? 역 가는 길을 여쭙고 싶은데요."},{"id":"L2-03","lv":2,"tag":"부탁","pol":"polite","v":"f","jp":"お願いします。","ruby":"お<ruby>願<rt>ねが</rt></ruby>いします。","kana":"おねがいします。","ko":"부탁합니다 / 잘 부탁드립니다","note":"주문·요청·인사 어디에나. これお願いします처럼 대상을 붙임.","ex":"水を一つお願いします。","exRuby":"<ruby>水<rt>みず</rt></ruby>を<ruby>一<rt>ひと</rt></ruby>つお<ruby>願<rt>ねが</rt></ruby>いします。","exKana":"みずをひとつおねがいします。","exKo":"물 하나 부탁합니다."},{"id":"L2-04","lv":2,"tag":"부탁","pol":"polite","v":"f","jp":"少し待っていただけますか。","ruby":"<ruby>少<rt>すこ</rt></ruby>し<ruby>待<rt>ま</rt></ruby>っていただけますか。","kana":"すこしまっていただけますか。","ko":"조금 기다려 주시겠어요?","note":"ていただけますか는 가장 정중한 부탁. てもらえますか는 조금 가벼움.","ex":"少し待っていただけますか。今、確認します。"," t>とりひきさき</rt></ruby>との<ruby>日程調整<rt>にっていちょうせい</rt></ruby>","titleKana":"とりひきさきとのにっていちょうせい","situation":"거래처의 제안을 정중히 거절하고 대안을 제시하는 전화","a":"f","b":"m","lines":[{"r":"A","jp":"いつもお世話になっております。来週の打ち合わせの件でお電話しました。","ruby":"いつもお<ruby>世話<rt>せわ</rt></ruby>になっております。<ruby>来週<rt>らいしゅう</rt></ruby>の<ruby>打<rt>う</rt></ruby>ち<ruby>合<rt>あ</rt></ruby>わせの<ruby>件<rt>けん</rt></ruby>でお<ruby>電話<rt>でんわ</rt></ruby>しました。","kana":"いつもおせわになっております。らいしゅうのうちあわせのけんでおでんわしました。","ko":"항상 신세 지고 있습니다. 다음 주 미팅 건으로 전화드렸습니다.","note":"전화 첫 문장은 お世話になっております + 용건."},{"r":"B","jp":"お世話になっております。ご連絡ありがとうございます。","ruby":"お<ruby>世話<rt>せわ</rt></ruby>になっております。ご<ruby>連絡<rt>れんらく</rt></ruby>ありがとうございます。","kana":"おせわになっております。ごれんらくありがとうございます。","ko":"신세 지고 있습니다. 연락 감사합니다.","note":"こちらも同じ挨拶을 돌려줌. 전화 예절의 대칭."},{"r":"A","jp":"水曜の午後はいかがでしょうか。","ruby":"<ruby>水曜<rt>すいよう</rt></ruby>の<ruby>午後<rt>ごご</rt></ruby>はいかがでしょうか。","kana":"すいようのごごはいかがでしょうか。","ko":"수요일 오후는 어떠실까요?","note":"날짜를 하나만 제시하면 거절 시 부담이 커짐. 보통 두 개 제시."},{"r":"B","jp":"あいにくですが、水曜は終日外勤しておりまして。木曜の午前でしたら伺えます。","ruby":"あいにくですが、<ruby>水曜<rt>すいよう</rt></ruby>は<ruby>終日<rt>しゅうじつ</rt></ruby><ruby>外<rt>がい</rt></ruby><ruby>勤<rt>きん</rt></ruby>しておりまして。<ruby>木曜<rt>もくよう</rt></ruby>の<ruby>午前<rt>ごぜん</rt></ruby>でしたら<ruby>伺<rt>うかが</rt></ruby>えます。","kana":"あいにくですが、すいようはしゅうじつがいきんしておりまして。もくようのごぜんでしたらうかがえます。","ko":"공교롭게도 수요일은 종일 외근이라서요. 목요일 오전이면 방문 가능합니다.","note":"あいにく + 사정 + 대안. 완곡 거절의 3단 구조."},{"r":"A","jp":"かしこまりました。木曜の午前十時で調整いたします。","ruby":"かしこまりました。<ruby>木曜<rt>もくよう</rt></ruby>の<ruby>午前十時<rt>ごぜんじゅうじ</rt></ruby>で<ruby>調整<rt>ちょうせい</rt></ruby>いたします。","kana":"かしこまりました。もくようのごぜんじゅうじでちょうせいいたします。","ko":"알겠습니다. 목요일 오전 10시로 조정하겠습니다.","note":"調整いたします＝제가 맞추겠습니다. 상대 부담을 덜어 줌."},{"r":"B","jp":"助かります。では、当日は私が受付までお迎えにあがります。","ruby":"<ruby>助<rt>たす</rt></ruby>かります。では、<ruby>当日<rt>とうじつ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>が<ruby>受付<rt>うけつけ</rt></ruby>までお<ruby>迎<rt>むか</rt></ruby>えにあがります。","kana":"たすかります。では、とうじつはわたしがうけつけまでおむかえにあがります。","ko":"도움이 됩니다. 그럼 당일에는 제가 접수처까지 마중 나가겠습니다.","note":"お迎えにあがる＝마중 나가다의 겸양. 관계를 굳히는 한마디."}]},{"id":"D8","lv":4,"title":"友人の悩みを聞く","titleRuby":"<ruby>友人<rt>ゆうじん</rt></ruby>の<ruby>悩<rt>なや</rt></ruby>みを<ruby>聞<rt>き</rt></ruby>く","titleKana":"ゆうじんのなやみをきく","situation":"친구가 일 이야기를 꺼내고, 들어주는 대화","a":"f","b":"f","lines":[{"r":"A","jp":"ねえ、ちょっと聞いてもいい？実は最近、仕事で落ち込んでて。","ruby":"ねえ、ちょっと<ruby>聞<rt>き</rt></ruby>いてもいい？<ruby>実<rt>じつ</rt></ruby>は<ruby>最近<rt>さいきん</rt></ruby>、<ruby>仕事<rt>しごと</rt></ruby>で<ruby>落<rt>お</rt></ruby>ち<ruby>込<rt>こ</rt></ruby>んでて。","kana":"ねえ、ちょっときいてもいい？じつはさいきん、しごとでおちこんでて。","ko":"저기, 잠깐 들어줄 수 있어? 실은 요즘 일 때문에 우울해서.","note":"고민을 꺼내는 입구. 聞いてもいい？가 부담을 낮춤."},{"r":"B","jp":"うん、もちろん。どうしたの？","ruby":"うん、もちろん。どうしたの？","kana":"うん、もちろん。どうしたの？","ko":"응, 물론이지. 무슨 일이야?","note":"열린 질문. 바로 조언하지 않고 문을 열어 줌."},{"r":"A","jp":"頑張ってるのに、認めてもらえない気がして。自分が足りないのかなって。","ruby":"<ruby>頑張<rt>がんば</rt></ruby>ってるのに、<ruby>認<rt>みと</rt></ruby>めてもらえない<ruby>気<rt>き</rt></ruby>がして。<ruby>自分<rt>じぶん</rt></ruby>が<ruby>足<rt>た</rt></ruby>りないのかなって。","kana":"がんばってるのに、みとめてもらえないきがして。じぶんがたりないのかなって。","ko":"열심히 하는데 인정받지 못하는 느낌이 들어. 내가 부족한 건가 싶고.","note":"감정 + 자기 의심. 해결책보다 인정이 먼저 필요한 지점."},{"r":"B","jp":"そっか…それは辛かったね。頑張ってるの、ちゃんと見てるよ。","ruby":"そっか…それは<ruby>辛<rt>つら</rt></ruby>かったね。<ruby>頑張<rt>がんば</rt></ruby>ってるの、ちゃんと<ruby>見<rt>み</rt></ruby>てるよ。","kana":"そっか…それはつらかったね。がんばってるの、ちゃんとみてるよ。","ko":"그렇구나… 힘들었겠다. 노력하고 있는 거 제대로 보고 있어.","note":"감정 반영 + 과정 인정. 일본에서 가장 효과적인 위로."},{"r":"A","jp":"…ありがとう。そう言ってもらえるだけで少し楽になる。","ruby":"…ありがとう。そう<ruby>言<rt>い</rt></ruby>ってもらえるだけで<ruby>少<rt>すこ</rt></ruby>し<ruby>楽<rt>らく</rt></ruby>になる。","kana":"…ありがとう。そういってもらえるだけですこしらくになる。","ko":"…고마워. 그렇게 말해 주는 것만으로 조금 편해져.","note":"해결 없이도 위로가 된다는 신호. 여기서 조언을 서두르면 역효과."},{"r":"B","jp":"焦らなくていいよ。話したくなったら、いつでも聞くから。","ruby":"<ruby>焦<rt>あせ</rt></ruby>らなくていいよ。<ruby>話<rt>はな</rt></ruby>したくなったら、いつでも<ruby>聞<rt>き</rt></ruby>くから。","kana":"あせらなくていいよ。はなしたくなったら、いつでもきくから。","ko":"조급해하지 않아도 돼. 얘기하고 싶어지면 언제든 들어줄게.","note":"문을 열어 두는 마무리. 焦らなくていいが 허용의 말."}]},{"id":"D9","lv":4,"title":"不満を伝える・関係の修復","titleRuby":"<ruby>不満<rt>ふまん</rt></ruby>を<ruby>伝<rt>つた</rt></ruby>える・<ruby>関係<rt>かんけい</rt></ruby>の<ruby>修復<rt>しゅうふく</rt></ruby>","titleKana":"ふまんをつたえる・かんけいのしゅうふく","situation":"연락이 뜸했던 친구에게 서운함을 부드럽게 전하는 대화","a":"f","b":"m","lines":[{"r":"A","jp":"最近、連絡くれなくなったね。忙しいのは分かってるんだけど。","ruby":"<ruby>最近<rt>さいきん</rt></ruby>、<ruby>連絡<rt>れんらく</rt></ruby>くれなくなったね。<ruby>忙<rt>いそが</rt></ruby>しいのは<ruby>分<rt>わ</rt></ruby>かってるんだけど。","kana":"さいきん、れんらくくれなくなったね。いそがしいのはわかってるんだけど。","ko":"요즘 연락이 없네. 바쁜 건 알겠는데.","note":"사실 + 상대 사정 인정. 비난 없이 문제를 표면화."},{"r":"B","jp":"ごめん、本当に忙しくて。連絡しようとは思ってたんだ。","ruby":"ごめん、<ruby>本当<rt>ほんとう</rt></ruby>に<ruby>忙<rt>いそが</rt></ruby>しくて。<ruby>連絡<rt>れんらく</rt></ruby>しようとは<ruby>思<rt>おも</rt></ruby>ってたんだ。","kana":"ごめん、ほんとうにいそがしくて。れんらくしようとはおもってたんだ。","ko":"미안, 정말 바빠서. 연락하려고는 생각했어.","note":"변명보다 사과 먼저. 思ってたんだ로 마음은 있었음을 전함."},{"r":"A","jp":"責めるつもりはないんだけど、私の感じ方かもしれないけど、寂しかった。","ruby":"<ruby>責<rt>せ</rt></ruby>める<ruby>つもり<rt>つもり</rt></ruby>はないんだけど、<ruby>私<rt>わたし</rt></ruby>の<ruby>感<rt>かん</rt></ruby>じ<ruby>方<rt>かた</rt></ruby>かもしれないけど、<ruby>寂<rt>さび</rt></ruby>しかった。","kana":"せめるつもりはないんだけど、わたしのかんじかたかもしれないけど、さびしかった。","ko":"탓할 생각은 아닌데, 내가 예민한 걸 수도 있지만, 외로웠어.","note":"쿠션어 2개 + 감정. 단정하지 않아 상대가 방어하지 않음."},{"r":"B","jp":"ごめんね。気づけなくて。距離を置きたいわけじゃないんだ。","ruby":"ごめんね。<ruby>気<rt>き</rt></ruby>づけなくて。<ruby>距離<rt>きょり</rt></ruby>を<ruby>置<rt>お</rt></ruby>きたいわけじゃないんだ。","kana":"ごめんね。きづけなくて。きょりをおきたいわけじゃないんだ。","ko":"미안. 눈치채지 못했어. 거리를 두고 싶은 건 아니야.","note":"오해를 먼저 없애는 문장. 이게 없으면 갈등이 커짐."},{"r":"A","jp":"うん、分かってる。一言もらえるだけで全然違うから。","ruby":"うん、<ruby>分<rt>わ</rt></ruby>かってる。<ruby>一言<rt>ひとこと</rt></ruby>もらえるだけで<ruby>全然<rt>ぜんぜん</rt></ruby><ruby>違<rt>ちが</rt></ruby>うから。","kana":"うん、わかってる。ひとこともらえるだけでぜんぜんちがうから。","ko":"응, 알아. 한마디만 있어도 전혀 달라.","note":"구체적 대안 제시. '연락해'보다 실행 가능."},{"r":"B","jp":"分かった。忙しくても、短くても連絡するようにするね。","ruby":"<ruby>分<rt>わ</rt></ruby>かった。<ruby>忙<rt>いそが</rt></ruby>しくても、<ruby>短<rt>みじか</rt></ruby>くても<ruby>連絡<rt>れんらく</rt></ruby>するようにするね。","kana":"わかった。いそがしくても、みじかくてもれんらくするようにするね。","ko":"알겠어. 바빠도 짧게라도 연락하도록 할게.","note":"구체적 약속. ようにする는 '노력하겠다'의 완곡한 확약."}]},{"id":"D10","lv":4,"title":"落ち込む友人を支える","titleRuby":"<ruby>落<rt>お</rt></ruby>ち<ruby>込<rt>こ</rt></ruby>む<ruby>友人<rt>ゆうじん</rt></ruby>を<ruby>支<rt>ささ</rt></ruby>える","titleKana":"おちこむゆうじんをささえる","situation":"시험에 실패한 친구가 아무 말도 하지 않는 밤","a":"f","b":"m","lines":[{"r":"A","jp":"今日、元気ないね。なにかあった？","ruby":"<ruby>今日<rt>きょう</rt></ruby>、<ruby>元気<rt>げんき</rt></ruby>ないね。なにかあった？","kana":"きょう、げんきないね。なにかあった？","ko":"오늘 기운이 없네. 무슨 일 있었어?","note":"상태를 관찰해 말을 거는 방식. 캐묻지 않음."},{"r":"B","jp":"…実は、試験に落ちたんだ。二回目で。","ruby":"…<ruby>実<rt>じつ</rt></ruby>は、<ruby>試験<rt>しけん</rt></ruby>に<ruby>落<rt>お</rt></ruby>ちたんだ。<ruby>二回目<rt>にかいめ</rt></ruby>で。","kana":"…じつは、しけんにおちたんだ。にかいめで。","ko":"…실은 시험에 떨어졌어. 두 번째로.","note":"짧게 털어놓음. 이때 질문을 이어 붙이면 닫힘."},{"r":"A","jp":"そうだったんだ…。返す言葉が見つからないけど、一緒にいるね。","ruby":"そうだったんだ…。<ruby>返<rt>かえ</rt></ruby>す<ruby>言葉<rt>ことば</rt></ruby>が<ruby>見<rt>み</rt></ruby>つからないけど、<ruby>一緒<rt>いっしょ</rt></ruby>にいるね。","kana":"そうだったんだ…。かえすことばがみつからないけど、いっしょにいるね。","ko":"그랬구나… 무슨 말을 해야 할지 모르겠지만, 같이 있을게.","note":"'할 말을 모르겠다'는 솔직함이 오히려 신뢰를 만듦."},{"r":"B","jp":"ありがとう。無理に励まさないでくれるのが、今はありがたい。","ruby":"ありがとう。<ruby>無理<rt>むり</rt></ruby>に<ruby>励<rt>はげ</rt></ruby>まさないでくれるのが、<ruby>今<rt>いま</rt></ruby>はありがたい。","kana":"ありがとう。むりにはげまさないでくれるのが、いまはありがたい。","ko":"고마워. 억지로 격려하지 않아 주는 게 지금은 고마워.","note":"칭찬보다 '격려하지 않기'가 위로라는 일본적 감각."},{"r":"A","jp":"うん。焦らなくていいよ。言葉を返さなくても大丈夫。","ruby":"うん。<ruby>焦<rt>あせ</rt></ruby>らなくていいよ。<ruby>言葉<rt>ことば</rt></ruby>を<ruby>返<rt>かえ</rt></ruby>さなくても<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>。","kana":"うん。あせらなくていいよ。ことばをかえさなくてもだいじょうぶ。","ko":"응. 조급해하지 않아도 돼. 뭐라고 답하지 않아도 괜찮아.","note":"返事 강요를 없애는 배려."},{"r":"B","jp":"…ちょっと楽になった。話せてよかった。","ruby":"…ちょっと<ruby>楽<rt>らく</rt></ruby>になった。<ruby>話<rt>はな</rt></ruby>せてよかった。","kana":"…ちょっとらくになった。はなせてよかった。","ko":"…조금 편해졌어. 얘기하길 잘했어.","note":"상담의 성과를 상대가 직접 말해 주는 마무리."}]},{"id":"D11","lv":5,"title":"進路の迷い","titleRuby":"<ruby>進路<rt>しんろ</rt></ruby>の<ruby>迷<rt>まよ</rt></ruby>い","titleKana":"しんろのまよい","situation":"전직을 고민하는 친구와 깊은 대화","a":"m","b":"f","lines":[{"r":"A","jp":"最近、自分が何をしたいのか、わからなくなって。転職も考えてるんだ。","ruby":"<ruby>最近<rt>さいきん</rt></ruby>、<ruby>自分<rt>じぶん</rt></ruby>が<ruby>何<rt>なに</rt></ruby>をしたいのか、わからなくなって。<ruby>転職<rt>てんしょく</rt></ruby>も<ruby>考<rt>かんが</rt></ruby>えてるんだ。","kana":"さいきん、じぶんがなにをしたいのか、わからなくなって。てんしょくもかんがえてるんだ。","ko":"요즘 내가 뭘 하고 싶은지 모르겠어. 이직도 생각 중이야.","note":"방향 상실 + 구체적 고민. 5단계 대화의 입구."},{"r":"B","jp":"そうなんだ。今の仕事は、嫌いになった感じ？それとも別の理由？","ruby":"そうなんだ。<ruby>今<rt>いま</rt></ruby>の<ruby>仕事<rt>しごと</rt></ruby>は、<ruby>嫌<rt>きら</rt></ruby>いになった<ruby>感<rt>かん</rt></ruby>じ？それとも<ruby>別<rt>べつ</rt></ruby>の<ruby>理由<rt>りゆう</rt></ruby>？","kana":"そうなんだ。いまのしごとは、きらいになったかんじ？それともべつのりゆう？","ko":"그렇구나. 지금 일이 싫어진 느낌이야? 아니면 다른 이유?","note":"선택지로 물어 상대가 언어화하기 쉽게 돕는 질문."},{"r":"A","jp":"嫌いっていうより、期待されることに疲れてしまって。自分の軸が見えないんだ。","ruby":"<ruby>嫌<rt>きら</rt></ruby>いっていうより、<ruby>期待<rt>きたい</rt></ruby>されることに<ruby>疲<rt>つか</rt></ruby>れてしまって。<ruby>自分<rt>じぶん</rt></ruby>の<ruby>軸<rt>じく</rt></ruby>が<ruby>見<rt>み</rt></ruby>えないんだ。","kana":"きらいっていうより、きたいされることにつかれてしまって。じぶんのじくがみえないんだ。","ko":"싫다기보다는 기대받는 것에 지쳐 버려서. 내 중심축이 안 보여.","note":"軸＝중심축. 추상 개념을 쓰면 대화가 깊어짐."},{"r":"B","jp":"期待に応えようとしてきたんだね。自分にとって、何が一番大事だと思う？","ruby":"<ruby>期待<rt>きたい</rt></ruby>に<ruby>応<rt>こた</rt></ruby>えようとしてきたんだね。<ruby>自分<rt>じぶん</rt></ruby>にとって、<ruby>何<rt>なに</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>大事<rt>だいじ</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>う？","kana":"きたいにこたえようとしてきたんだね。じぶんにとって、なにがいちばんだいじだとおもう？","ko":"기대에 부응하려고 해 왔구나. 자기한테 가장 중요한 게 뭐라고 생각해?","note":"공감 → 가치관 질문. 5단계의 핵심 전환."},{"r":"A","jp":"…たぶん、誰かの役に立ってる実感がほしいんだと思う。評価じゃなくて。","ruby":"…たぶん、<ruby>誰<rt>だれ</rt></ruby>かの<ruby>役<rt>やく</rt></ruby>に<ruby>立<rt>た</rt></ruby>ってる<ruby>実感<rt>じっかん</rt></ruby>がほしいんだと<ruby>思<rt>おも</rt></ruby>う。<ruby>評価<rt>ひょうか</rt></ruby>じゃなくて。","kana":"…たぶん、だれかのやくにたってるじっかんがほしいんだとおもう。ひょうかじゃなくて。","ko":"…아마, 누군가에게 도움이 된다는 실감이 갖고 싶은 것 같아. 평가가 아니라.","note":"評価じゃなくて로 대비. 스스로 답을 찾아가는 순간."},{"r":"B","jp":"答えを出さなくてもいいのかもしれないね。今の言葉、忘れないでほしいな。","ruby":"<ruby>答<rt>こた</rt></ruby>えを<ruby>出<rt>だ</rt></ruby>さなくてもいいのかもしれないね。<ruby>今<rt>いま</rt></ruby>の<ruby>言葉<rt>ことば</rt></ruby>、<ruby>忘<rt>わす</rt></ruby>れないでほしいな。","kana":"こたえをださなくてもいいのかもしれないね。いまのことば、わすれないでほしいな。","ko":"답을 내지 않아도 되는 걸지도. 지금 그 말, 잊지 않았으면 해.","note":"해결을 강요하지 않고 발견을 남겨 주는 마무리."}]},{"id":"D12","lv":5,"title":"後悔と選択","titleRuby":"<ruby>後悔<rt>こうかい</rt></ruby>と<ruby>選択<rt>せんたく</rt></ruby>","titleKana":"こうかいとせんたく","situation":"오랜 선택을 돌아보는 새벽 대화","a":"f","b":"m","lines":[{"r":"A","jp":"後悔してるわけじゃないんだけど、たまに考えるんだ。昔の選択のこと。","ruby":"<ruby>後悔<rt>こうかい</rt></ruby>してるわけじゃないんだけど、たまに<ruby>考<rt>かんが</rt></ruby>えるんだ。<ruby>昔<rt>むかし</rt></ruby>の<ruby>選択<rt>せんたく</rt></ruby>のこと。","kana":"こうかいしてるわけじゃないんだけど、たまにかんがえるんだ。むかしのせんたくのこと。","ko":"후회하는 건 아닌데, 가끔 생각해. 옛날 선택에 대해.","note":"후회를 부정하며 미련을 인정하는 틀. 대화를 여는 안전한 입구."},{"r":"B","jp":"後悔って、答えがないから残るんだよね。どの選択が正しかったかは、誰にも分からないし。","ruby":"<ruby>後悔<rt>こうかい</rt></ruby>って、<ruby>答<rt>こた</rt></ruby>えがないから<ruby>残<rt>のこ</rt></ruby>るんだよね。どの<ruby>選択<rt>せんたく</rt></ruby>が<ruby>正<rt>ただ</rt></ruby>しかったかは、<ruby>誰<rt>だれ</rt></ruby>にも<ruby>分<rt>わ</rt></ruby>からないし。","kana":"こうかいって、こたえがないからのこるんだよね。どのせんたくがただしかったかは、だれにもわからないし。","ko":"후회는 답이 없어서 남는 거지. 어떤 선택이 맞았는지는 아무도 모르니까.","note":"단정하지 않고 함께 생각하는 문장. ～し로 여운을 남김."},{"r":"A","jp":"うん。あのとき、違う選択をしていたらどうなってたんだろうね。","ruby":"うん。あのとき、<ruby>違<rt>ちが</rt></ruby>う<ruby>選択<rt>せんたく</rt></ruby>をしていたらどうなってたんだろうね。","kana":"うん。あのとき、ちがうせんたくをしていたらどうなってたんだろうね。","ko":"응. 그때 다른 선택을 했더라면 어땠을까.","note":"가정법. 답이 아니라 상상의 공유."},{"r":"B","jp":"今ある自分は、その選択の上にあるんだよね。後悔も含めて、今のあなたなんだと思う。","ruby":"<ruby>今<rt>いま</rt></ruby>ある<ruby>自分<rt>じぶん</rt></ruby>は、その<ruby>選択<rt>せんたく</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>にあるんだよね。<ruby>後悔<rt>こうかい</rt></ruby>も<ruby>含<rt>ふく</rt></ruby>めて、<ruby>今<rt>いま</rt></ruby>のあなたなんだと<ruby>思<rt>おも</rt></ruby>う。","kana":"いまあるじぶんは、そのせんたくのうえにあるんだよね。こうかいもふくめて、いまのあなたなんだとおもう。","ko":"지금의 나는 그 선택 위에 있는 거지. 후회까지 포함해서 지금의 너인 것 같아.","note":"전체 수용. 含めて가 핵심어."},{"r":"A","jp":"…そう言ってもらえると、少し救われる。言葉にすると、軽くなる気がするね。","ruby":"…そう<ruby>言<rt>い</rt></ruby>ってもらえると、<ruby>少<rt>すこ</rt></ruby>し<ruby>救<rt>すく</rt></ruby>われる。<ruby>言葉<rt>ことば</rt></ruby>にすると、<ruby>軽<rt>かる</rt></ruby>くなる<ruby>気<rt>き</rt></ruby>がするね。","kana":"…そういってもらえると、すこしすくわれる。ことばにすると、かるくなるきがするね。","ko":"…그렇게 말해 주면 조금 위로가 돼. 말로 하면 가벼워지는 것 같아.","note":"언어화의 효과. 상담 대화의 전환점."},{"r":"B","jp":"今夜みたいに、またこうやって話せたら嬉しい。","ruby":"<ruby>今夜<rt>こんや</rt></ruby>みたいに、またこうやって<ruby>話<rt>はな</rt></ruby>せたら<ruby>嬉<rt>うれ</rt></ruby>しい。","kana":"こんやみたいに、またこうやってはなせたらうれしい。","ko":"오늘 밤처럼, 또 이렇게 이야기할 수 있으면 좋겠어.","note":"관계의 지속을 청하는 완곡한 초대. 부담 없는 마무리."}]},{"id":"D13","lv":5,"title":"深夜の本音トーク","titleRuby":"<ruby>深夜<rt>しんや</rt></ruby>の<ruby>本音<rt>ほんね</rt></ruby>トーク","titleKana":"しんやのほんねトーク","situation":"오랜 친구와 새벽에 나누는 진심 대화","a":"m","b":"f","lines":[{"r":"A","jp":"弱さを見せるのが怖いんだと思う。嫌われるのが怖くて、平気な顔してた。","ruby":"<ruby>弱<rt>よわ</rt></ruby>さを<ruby>見<rt>み</rt></ruby>せるのが<ruby>怖<rt>こわ</rt></ruby>いんだと<ruby>思<rt>おも</rt></ruby>う。<ruby>嫌<rt>きら</rt></ruby>われるのが<ruby>怖<rt>こわ</rt></ruby>くて、<ruby>平気<rt>へいき</rt></ruby>な<ruby>顔<rt>かお</rt></ruby>してた。","kana":"よわさをみせるのがこわいんだとおもう。きらわれるのがこわくて、へいきなかおしてた。","ko":"약한 모습을 보이는 게 무서운 것 같아. 미움받는 게 무서워서 아무렇지 않은 척했어.","note":"자기 분석 + 행동. 깊은 대화는 '왜'보다 '무엇이 두려운지'로."},{"r":"B","jp":"平気な顔してる人ほど、中で色々抱えてるんだよね。私もそうだった。","ruby":"<ruby>平気<rt>へいき</rt></ruby>な<ruby>顔<rt>かお</rt></ruby>してる<ruby>人<rt>ひと</rt></ruby>ほど、<ruby>中<rt>なか</rt></ruby>で<ruby>色々<rt>いろいろ</rt></ruby><ruby>抱<rt>かか</rt></ruby>えてるんだよね。<ruby>私<rt>わたし</rt></ruby>もそうだった。","kana":"へいきなかおしてるひとほど、なかでいろいろかかえてるんだよね。わたしもそうだった。","ko":"아무렇지 않은 얼굴을 하는 사람일수록 속에 여러 가지를 안고 있지. 나도 그랬어.","note":"자기 개방. 상대를 특별하게 만들지 않고 함께 있는 느낌을 줌."},{"r":"A","jp":"言ってしまえば簡単なのに、言うと重いかなって思って。人に言えなかった。","ruby":"<ruby>言<rt>い</rt></ruby>ってしまえば<ruby>簡単<rt>かんたん</rt></ruby>なのに、<ruby>言<rt>い</rt></ruby>うと<ruby>重<rt>おも</rt></ruby>いかなって<ruby>思<rt>おも</rt></ruby>って。<ruby>人<rt>ひと</rt></ruby>に<ruby>言<rt>い</rt></ruby>えなかった。","kana":"いってしまえばかんたんなのに、いうとおもいかなっておもって。ひとにいえなかった。","ko":"말해 버리면 간단한데, 말하면 무거울까 봐. 사람에게 말 못 했어.","note":"'무겁다'는 일본 특유의 관계 부담을 정확히 표현."},{"r":"B","jp":"重くないよ。話してくれてありがとう。ここで置いていってもいいんだよ。","ruby":"<ruby>重<rt>おも</rt></ruby>くないよ。<ruby>話<rt>はな</rt></ruby>してくれてありがとう。ここで<ruby>置<rt>お</rt></ruby>いていってもいいんだよ。","kana":"おもくないよ。はなしてくれてありがとう。ここでおいていってもいいんだよ。","ko":"무겁지 않아. 얘기해 줘서 고마워. 여기다 두고 가도 돼.","note":"'두고 가도 된다'는 이미지가 부담을 실제로 없애 줌."},{"r":"A","jp":"…そうか。じゃあ、今日だけは強がらないでおくよ。","ruby":"…そうか。じゃあ、<ruby>今日<rt>きょう</rt></ruby>だけは<ruby>強<rt>つよ</rt></ruby>がらないでおくよ。","kana":"…そうか。じゃあ、きょうだけはつよがらないでおくよ。","ko":"…그런가. 그럼 오늘만큼은 센 척하지 않을게.","note":"허락을 받아들인 표시. 변화의 시작을 스스로 선언."},{"r":"B","jp":"うん、それでいい。無理に変わらなくても、そのままでいいんじゃないかな。","ruby":"うん、それでいい。<ruby>無理<rt>むり</rt></ruby>に<ruby>変<rt>か</rt></ruby>わらなくても、そのままでいいんじゃないかな。","kana":"うん、それでいい。むりにかわらなくても、そのままでいいんじゃないかな。","ko":"응, 그래도 돼. 억지로 변하지 않아도 그대로도 괜찮지 않을까.","note":"수용으로 닫음. 조언 없이도 대화가 완결되는 구조."}]},{"id":"D14","lv":4,"title":"恋人とのすれ違い","titleRuby":"<ruby>恋人<rt>こいびと</rt></ruby>とのすれ<ruby>違<rt>ちが</rt></ruby>い","titleKana":"こいびととのすれちがい","situation":"연락과 거리감에 대한 오해를 풀어 가는 대화","a":"f","b":"m","lines":[{"r":"A","jp":"最近、一緒にいても遠く感じるんだ。私の気にしすぎかな。","ruby":"<ruby>最近<rt>さいきん</rt></ruby>、<ruby>一緒<rt>いっしょ</rt></ruby>にいても<ruby>遠<rt>とお</rt></ruby>く<ruby>感<rt>かん</rt></ruby>じるんだ。<ruby>私<rt>わたし</rt></ruby>の<ruby>気<rt>き</rt></ruby>にしすぎかな。","kana":"さいきん、いっしょにいてもとおくかんじるんだ。わたしのきにしすぎかな。","ko":"요즘 같이 있어도 멀게 느껴져. 내가 너무 예민한 걸까.","note":"감정을 '나의 느낌'으로 한정해 상대를 공격하지 않음."},{"r":"B","jp":"ごめん、そんなつもりはなかった。忙しくて余裕がなかったのは本当だけど。","ruby":"ごめん、そんなつもりはなかった。<ruby>忙<rt>いそが</rt></ruby>しくて<ruby>余裕<rt>よゆう</rt></ruby>がなかったのは<ruby>本当<rt>ほんとう</rt></ruby>だけど。","kana":"ごめん、そんなつもりはなかった。いそがしくてよゆうがなかったのはほんとうだけど。","ko":"미안, 그럴 생각은 아니었어. 바빠서 여유가 없었던 건 사실이지만.","note":"사과 + 사실 인정. 변명으로 들리지 않게 本当だけど로 한정."},{"r":"A","jp":"理由が知りたかっただけ。責めてるんじゃなくて、置いていかれそうで怖かった。","ruby":"<ruby>理由<rt>りゆう</rt></ruby>が<ruby>知<rt>し</rt></ruby>りたかっただけ。<ruby>責<rt>せ</rt></ruby>めてるんじゃなくて、<ruby>置<rt>お</rt></ruby>いていかれそうで<ruby>怖<rt>こわ</rt></ruby>かった。","kana":"りゆうがしりたかっただけ。せめてるんじゃなくて、おいていかれそうでこわかった。","ko":"이유를 알고 싶었을 뿐이야. 탓하는 게 아니라, 뒤처질 것 같아서 무서웠어.","note":"요구가 아니라 두려움을 말함. 갈등이 정보 교환으로 바뀜."},{"r":"B","jp":"言ってくれてありがとう。忙しいときこそ、一言伝えるようにするね。","ruby":"<ruby>言<rt>い</rt></ruby>ってくれてありがとう。<ruby>忙<rt>いそが</rt></ruby>しいときこそ、<ruby>一言<rt>ひとこと</rt></ruby><ruby>伝<rt>つた</rt></ruby>えるようにするね。","kana":"いってくれてありがとう。いそがしいときこそ、ひとことつたえるようにするね。","ko":"말해 줘서 고마워. 바쁠 때일수록 한마디 전하도록 할게.","note":"구체적 행동 약속. ようにする로 부담 없이 확약."},{"r":"A","jp":"うん。私も、察してほしいだけじゃなくて、言葉で言うようにする。","ruby":"うん。私も、<ruby>察<rt>さっ</rt></ruby>してほしいだけじゃなくて、<ruby>言葉<rt>ことば</rt></ruby>で<ruby>言<rt>い</rt></ruby>うようにする。","kana":"うん。私も、さっしてほしいだけじゃなくて、ことばでいうようにする。","ko":"응. 나도 눈치채 주기만 바라지 말고 말로 하도록 할게.","note":"상호 책임을 인정. 察する(눈치채다) 문화의 한계를 보완."},{"r":"B","jp":"一緒に直していこう。距離を置きたいわけじゃないから。","ruby":"<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>直<rt>なお</rt></ruby>していこう。<ruby>距離<rt>きょり</rt></ruby>を<ruby>置<rt>お</rt></ruby>きたいわけじゃないから。","kana":"いっしょになおしていこう。きょりをおきたいわけじゃないから。","ko":"같이 고쳐 가자. 거리를 두고 싶은 건 아니니까.","note":"'함께'와 '오해 해소'로 닫는 마무리."}]}],"meta":{"app":{"title":"일본어 스피킹 훈련소","sub":"회화 표현 · 쉐도잉 · 실전 롤플레이","version":"1.0","builtAt":"2026-11-20"},"method":[{"n":1,"t":"한국어 뜻만 보고 먼저 말하기","d":"카드 앞면에는 한국어 뜻만 나옵니다. 일본어를 떠올려 소리 내어 말한 뒤에 넘기세요. '알고 있는 것'과 '입에서 나오는 것'은 다릅니다. 인출(retrieval)이 기억을 만듭니다."},{"n":2,"t":"원어민 음성 듣고 바로 따라 말하기(쉐도잉)","d":"표현 카드의 '듣고 3초 따라말하기' 루프를 쓰세요. 음성을 듣고 → 3초 안에 따라 말하고 → 다시 듣습니다. 속도는 0.75x부터 시작해 1.15x까지 올리면 리듬이 몸에 붙습니다."},{"n":3,"t":"내 목소리 녹음과 비교","d":"한 번 말하고 녹음해 원어민 음성과 번갈아 들어 보세요. 억양·길이·강세가 어디서 어긋나는지 귀로 확인하는 것이 가장 빠른 교정입니다."},{"n":4,"t":"롤플레이는 A를 듣고 B를 말하기","d":"실전 대화에서는 상대(A) 음성을 먼저 듣고, 내 차례(B)의 한국어 힌트만 보고 말합니다. 막히면 정답을 열어 성우 음성을 듣고, 같은 턴을 다시 말해 보세요."},{"n":5,"t":"매일 10문장 드릴","d":"'오늘의 드릴'은 전체 표현에서 무작위 10문장을 뽑습니다. 10분이면 끝나고, 완료 체크와 저장함은 이 기기에 남습니다."}],"tips":[{"cat":"발음·억양","t":"일본어는 '박자(モーラ)' 언어","d":"한 글자 = 한 박자입니다. きって는 '킷-테'(3박), きて는 '키-테'(2박). 한국어처럼 붙여 읽으면 길이가 뭉개지므로, 손뼉으로 박자를 치며 따라 말해 보세요.","src":"https://shadowingjapanese.com/ja/practice","srcName":"ShadowingJapanese"},{"cat":"발음·억양","t":"피치(고저)를 같이 따라하기","d":"일본어는 강세가 아니라 높낮이입니다. はし(橋·다리)는 '하-시↘', はし(箸·젓가락)는 '하↗시'. 단어 카드에서 로마자 밑 화살표 대신 원어민 음성의 높낮이를 그대로 흉내 내 보세요.","src":"https://www.tofugu.com/japanese-learning-resources-database/studyin-daily-japanese/","srcName":"Tofugu / StudyIn Daily Japanese"},{"cat":"발음·억양","t":"쉐도잉은 '1~2초 늦게, 같은 리듬으로'","d":"통역사 훈련에서 온 방법입니다. 뜻을 이해하려 애쓰지 말고 소리·억양·속도를 그림자처럼 복제하세요. 하루 15분이면 3주 안에 리듬이 바뀝니다.","src":"https://shadowingjapanese.com/ja/practice","srcName":"ShadowingJapanese"},{"cat":"쉐도잉 교재","t":"'新・シャドーイング 日本語を話そう!' 시리즈","d":"초~중급부터 상급까지 단계별 문장과 정중체/반말 표기가 함께 있는 교재. 음원을 내려받아 앱의 쉐도잉 루프와 같이 쓰기 좋습니다.","src":"https://www.9640.jp/nihongo/ja/detail/?850","srcName":"くろしお出版"},{"cat":"유튜브","t":"日本語の森 — JLPT별 문법·회화","d":"N1~N5 문법과 회화를 레벨별로 정리. 관서 사투리 강좌도 있어 리듬 적응에 도움.","src":"https://nihongocafe.jp/8-youtube-channels-for-learning-japanese-language/","srcName":"nihongocafe / YouTube"},{"cat":"유튜브","t":"Japanese with Shun — 레벨 표기된 실제 대화","d":"제목에 N5~N3 레벨이 붙은 인터뷰·일상 대화. 화면 자막과 함께 3~4줄씩 따라 말하기에 적합.","src":"https://playlingo.app/ja/blog/best-youtube-channels-to-learn-japanese","srcName":"PlayLingo"},{"cat":"유튜브","t":"Sayuri Saying / Miku Real Japanese — 자연스러운 수다","d":"원어민끼리 실제로 주고받는 속도와 추임새를 익히기 좋습니다. 자막을 켜고 본 뒤 끄고 다시 보세요.","src":"https://nihongocafe.jp/8-youtube-channels-for-learning-japanese-language/","srcName":"nihongocafe"},{"cat":"유튜브","t":"あかね的日本語教室 — 생활 장면 회화","d":"전화 응대, 아르바이트 면접, 택배 재배달 같은 '실제로 막히는 장면'을 다룹니다. Lv.2~3과 함께 보면 좋습니다.","src":"https://konekura.com/nihongo-youtube-2/","srcName":"ジャパリのまち"},{"cat":"유튜브","t":"Speak Japanese Naturally — 후리가나 Vlog","d":"일상 브이로그에 학습자용 나레이션과 후리가나 자막. 앱의 후리가나 토글과 병행하면 읽기 훈련이 됩니다.","src":"https://playlingo.app/ja/blog/best-youtube-channels-to-learn-japanese","srcName":"PlayLingo"},{"cat":"네이버 블로그","t":"추임새·리액션 표현은 '짧게' 익히기","d":"そうなんだ！・なるほど・確かに・それな・それはちょっと… 같은 한 줄 리액션이 회화 체감을 가장 크게 바꿉니다. Lv.1 카드가 이 역할입니다.","src":"https://m.blog.naver.com/shj0504/221667027820","srcName":"네이버 블로그"},{"cat":"네이버 블로그","t":"'그냥'은 なんとなく, '뭐래는거야'는 意味わからない","d":"한국어 '그냥'을 ただ로 옮기면 어색합니다. 이유 없이 말할 때는 なんとなく가 자연스럽고, 상대 말이 이해 안 될 때는 意味わからない(→わかんない)를 씁니다.","src":"https://m.blog.naver.com/sonyloves/221985183205","srcName":"네이버 블로그"},{"cat":"네이버 블로그","t":"한국인이 자주 틀리는 경어 습관","d":"自分の家族には さん을 붙이지 않습니다(私の父は…). 先生様처럼 존칭 위에 様를 겹치지도 않습니다. 한국어 경어 습관이 그대로 나오는 지점입니다.","src":"https://m.blog.naver.com/cufspr/222468575982","srcName":"사이버한국외대 블로그"},{"cat":"네이버 블로그","t":"간사이벤 최소 세트","d":"あかん=안 돼, ええ=좋아, ほんま=진짜, ちゃう=아니야, めっちゃ=엄청, おおきに=고맙습니다. 오사카·교토 여행 전에 이 여섯 개만 익혀도 반응이 달라집니다.","src":"https://m.blog.naver.com/hackersjapan/223872742971","srcName":"해커스 일본어 블로그"},{"cat":"여행 회화","t":"です/ます만 붙여도 절반은 통한다","d":"짧은 표현 + です·ます + 미소. 모르면 すみません + 제스처 + 번역앱. 정중한 말투 자체를 일본인은 크게 평가합니다.","src":"https://m.blog.naver.com/heechul1204/224159133130","srcName":"네이버 블로그"},{"cat":"X(트위터)","t":"요즘 말은 '줄임'과 '접두어'로 만든다","d":"2025년 전후로는 爆(ばく)·激(げき)을 붙이는 강조(激うま·爆バズ), 긴 말을 줄이는 축약(あーね·きまZ·り)이 유행. 세대·장면을 벗어나면 통하지 않으니 친한 사이에서만.","src":"https://x.com/dannydenny95356/status/2118905016392315181","srcName":"X 공개 포스트"},{"cat":"X(트위터)","t":"유행어는 반감기가 짧다","d":"ぴえん·まじ卍처럼 한 세대를 지나면 '옛말'이 됩니다. 앱의 Lv.1은 지금 쓰이는 것과 곧 사라질 것을 구분해 표시했으니, 처음 만난 사람에게는 Lv.2 표준 표현을 쓰세요.","src":"https://www.koukouseishinbun.jp/articles/-/11188","srcName":"고교생신문 설문"},{"cat":"인스타그램","t":"짧은 릴스로 장면별 표현 수집","d":"공개 계정의 릴스는 문장이 짧고 자막이 붙어 있어 표현 수집에 좋습니다(예: StudyIn Daily Japanese). 단, 인스타는 로그인 장벽이 있어 공개 웹에 색인된 범위만 참고했습니다.","src":"https://www.tofugu.com/japanese-learning-resources-database/studyin-daily-japanese/","srcName":"Tofugu"},{"cat":"인스타그램","t":"소셜 미디어 몰입 루틴","d":"일본어 계정만 20~30개 팔로우 → 하루 10분 표현 캡처 → 주 1회 3문장 요약. 피드를 '일본어만'으로 바꾸는 것이 가장 큰 효과.","src":"https://hanabira.org/blog/social-media-immersion-for-japanese","srcName":"Hanabira"},{"cat":"경청(Lv.4~5)","t":"조언보다 '받아주기'가 먼저","d":"「たいしたことじゃない」「元気出して」는 역효과. 「そうだったんだ」「それは辛かったね」「よく話してくれたね」가 실제로 위로가 됩니다.","src":"https://www4.city.sapporo.jp/hottokenai-kokoro/shinpai/taiou/sakeru.html","srcName":"삿포로시 마음의 나비"},{"cat":"경청(Lv.4~5)","t":"오ウム返し · 요약 · 감정 언어화","d":"상대 말을 그대로 되돌려 주고(「仕事が忙しくて大変なんですね」), 마지막에 요약(「つまり〜ということですね」), 감정을 단어로(「不安なんですね」). 이 세 가지만으로 대화의 깊이가 달라집니다.","src":"https://www.therapeia.jp/20250212/","srcName":"심리상담실 세라페이아"},{"cat":"경청(Lv.4~5)","t":"'어떻게 들어주길 원하는지' 먼저 묻기","d":"「話を聞くだけでいい？アドバイスがほしい？」 — 조언·공감·정리를 먼저 확인하면 엇나간 위로를 막을 수 있습니다.","src":"https://lightring.or.jp/magazine/magazine04/","srcName":"NPO Light Ring"},{"cat":"경청(Lv.4~5)","t":"Why 대신 How로 묻기","d":"「どうして？」는 추궁으로 들립니다. 「どんな感じだった？」「どんなふうに思う？」가 대화를 엽니다. I(아이)메시지로 내 감정을 주어로 말하는 것도 같은 원리.","src":"https://www.mhlw.go.jp/kokoro/parent/mental/ftf/ftf_02.html","srcName":"후생노동성"},{"cat":"비즈니스","t":"쿠션어는 '한 문장에 하나만'","d":"恐れ入りますが·お手数ですが·差し支えなければ를 겹치면 용건이 묻힙니다. 하나 고르고 곧바로 구체적 부탁(무엇을·언제까지)을 붙이세요.","src":"https://mail-sakusei.com/guide/kushion-kotoba","srcName":"비즈니스 문서 AI"},{"cat":"비즈니스","t":"거절은 3단 구조로","d":"감사(ありがたいお話ですが) → 사정(あいにく) → 결론(今回は見送らせていただきます). 이 순서를 지키면 관계가 상하지 않습니다.","src":"https://mail-sakusei.com/guide/kushion-kotoba","srcName":"비즈니스 문서 AI"},{"cat":"비즈니스","t":"보고는 결론부터","d":"「結論から申し上げますと」로 시작하고, 원인·대응·다음 단계를 붙입니다. 사과는 변명 없이 '내 확인 부족'을 먼저 인정.","src":"https://www.business-bunrei.com/mail/697/","srcName":"비즈니스 문례 내비"}],"sources":[{"k":"YouTube","n":"日本語の森 / Japanese with Shun / Sayuri Saying / Miku Real Japanese / Meshclass 日本語 / Speak Japanese Naturally / あかね的日本語教室 / Japanese Ammo with Misa","u":"https://nihongocafe.jp/8-youtube-channels-for-learning-japanese-language/"},{"k":"YouTube","n":"레벨별 추천 채널 정리(2026-10 실제 확인)","u":"https://playlingo.app/ja/blog/best-youtube-channels-to-learn-japanese"},{"k":"네이버 블로그","n":"일상생활 일본어 회화 표현 정리(리액션 30선)","u":"https://m.blog.naver.com/shj0504/221667027820"},{"k":"네이버 블로그","n":"현지인이 진짜 쓰는 일본어(なんとなく·意味わからない)","u":"https://m.blog.naver.com/sonyloves/221985183205"},{"k":"네이버 블로그","n":"한국인이 실수하기 쉬운 일본어 어휘·회화","u":"https://m.blog.naver.com/cufspr/222468575982"},{"k":"네이버 블로그","n":"간사이벤 회화 정리(해커스)","u":"https://m.blog.naver.com/hackersjapan/223872742971"},{"k":"네이버 블로그","n":"일본 여행 필수 회화 상황별 모음","u":"https://m.blog.naver.com/heechul1204/224159133130"},{"k":"X","n":"2025 유행어 'ドパガキ'·신어 후보 분석 포스트","u":"https://x.com/dannydenny95356/status/2118905016392315181"},{"k":"웹","n":"Z세대若者言葉 45선(닛푸티부동산, 2025-10 설문)","u":"https://myhome-style.com/column/kaji/251126509670/"},{"k":"웹","n":"중고생 若者言葉·LINE用語 설문(고교생신문)","u":"https://www.koukouseishinbun.jp/articles/-/11188"},{"k":"웹","n":"2025 若者言葉 완전 가이드(OMOTENASHI)","u":"https://omotenashi-world.com/content/article2/"},{"k":"웹","n":"クッション言葉 40선·거절 3단 구조","u":"https://mail-sakusei.com/guide/kushion-kotoba"},{"k":"웹","n":"傾聴(경청) 3원칙·반영·요약","u":"https://www.therapeia.jp/20250212/"},{"k":"웹","n":"삿포로시 '피하고 싶은 말 걸기'","u":"https://www4.city.sapporo.jp/hottokenai-kokoro/shinpai/taiou/sakeru.html"},{"k":"웹","n":"후생노동성 '이야기를 듣는 요령'","u":"https://www.mhlw.go.jp/kokoro/parent/mental/ftf/ftf_02.html"},{"k":"인스타그램(공개 웹)","n":"StudyIn Daily Japanese — 짧은 표현 릴스(공개 색인 범위)","u":"https://www.tofugu.com/japanese-learning-resources-database/studyin-daily-japanese/"},{"k":"인스타그램(공개 웹)","n":"소셜 미디어 몰입 학습법","u":"https://hanabira.org/blog/social-media-immersion-for-japanese"},{"k":"쉐도잉","n":"쉐도잉 방법론·연습 영상","u":"https://shadowingjapanese.com/ja/practice"},{"k":"쉐도잉","n":"新・シャドーイング 日本語を話そう! (くろしお出版)","u":"https://www.9640.jp/nihongo/ja/detail/?850"}],"limits":["인스타그램은 로그인 장벽이 있어 공개 웹에 색인된 게시물·소개 글만 참고했습니다. 계정 내부 릴스·스토리·저장 콘텐츠는 수집 대상이 아닙니다.","네이버는 블로그 공개 글을 참고했고, 카페·지식iN 로그인 전용 게시판은 제외했습니다.","X는 공개 검색 결과만 사용했고, 보호된 계정·DM은 포함하지 않았습니다.","유튜브는 영상 자막이 아닌 공개 설명·추천 목록·학습 후기 글을 근거로 삼았습니다.","모든 표현은 원문 인용이 아니라 학습용으로 다시 쓴 것이며, 유행어는 2025~2026년 공개 자료 기준입니다. 실제 사용 전에는 상대와 장면(TPO)을 확인하세요."]}};

/* ═════════ kana → romaji ═════════ */
var R1 = {'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o','ん':'n','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゃ':'ya','ゅ':'yu','ょ':'yo','ゎ':'wa','ゔ':'vu','ー':'-'};
var R2 = {'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo','ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo','てぃ':'ti','でぃ':'di','とぅ':'tu','どぅ':'du','うぇ':'we','うぃ':'wi','ゔぁ':'va','ゔぃ':'vi','ゔぇ':'ve','ゔぉ':'vo','しぇ':'she','ちぇ':'che','じぇ':'je'};
function romaji(str){
  var s = str.replace(/[\u30a1-\u30f6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); });
  var out = '', i = 0, lastVowel = '';
  while (i < s.length) {
    var c = s[i], two = s.substr(i,2);
    if (c === 'っ') { i++; var r0 = R2[s.substr(i,2)] || R1[s[i]] || ''; if (r0) out += r0[0]; continue; }
    if (c === 'ー') { out += lastVowel; i++; continue; }
    if (c === 'ん') { var nx2 = s[i+1] || ''; out += (/[あいうえおやゆゆよ]/.test(nx2) ? "n'" : 'n'); i++; continue; }
    var r = R2[two];
    if (r) { out += r; lastVowel = r.slice(-1); i += 2; continue; }
    r = R1[c];
    if (r) { out += r; lastVowel = /[aeiou]/.test(r.slice(-1)) ? r.slice(-1) : lastVowel; i++; continue; }
    if (/[、。！？…\s「」]/.test(c)) { out += ' '; i++; continue; }
    out += c; i++;
  }
  return out.replace(/\s+/g,' ').trim();
}

/* ═════════ audio (all playback uses S.rate, default 1.2) ═════════ */
var curA = null, loopTimer = null, loopOn = false;
var canAudio = (typeof Audio !== 'undefined') && !/^file:/i.test(location.protocol||'');
function stopAll(){
  loopOn = false; clearTimeout(loopTimer); loopTimer = null;
  if (curA) { try{ curA.pause(); }catch(e){} curA = null; }
  document.querySelectorAll('.playing').forEach(function(l){ l.classList.remove('playing'); });
  var lb = $('#rLoop'); if (lb) lb.classList.remove('on');
  var lbl = $('#rLoopLbl'); if (lbl) lbl.textContent = '따라말하기';
  if (window.speechSynthesis) { try{ speechSynthesis.cancel(); }catch(e){} }
}
function playFile(name, onend, opts){
  opts = opts || {};
  if (!opts.keep) stopAll();
  if (!canAudio) { toast('이 환경에서는 음원을 재생할 수 없습니다'); return null; }
  var a = new Audio('audio/' + name + '.mp3');
  a.preload = 'auto';
  a.volume = 1;
  try { a.playbackRate = S.rate; } catch(e){}
  a.onplaying = function(){ try { if (Math.abs((a.playbackRate||1)-S.rate) > .01) a.playbackRate = S.rate; } catch(e){} };
  a.onended = function(){ if (curA === a) curA = null; if (onend) onend(); };
  a.onerror = function(){ toast('음원을 불러오지 못했습니다'); };
  curA = a;
  var p = a.play(); if (p && p.catch) p.catch(function(){ toast('재생이 차단되었습니다. 다시 눌러 주세요'); });
  return a;
}
function rateLabel(){ return (Math.round(S.rate*10)/10) + 'x'; }

/* ═════════ recording & comparison ═════════ */
var rec = null, recChunks = [], recUrl = null, recStream = null, recTimer = null, recOwner = null, recCard = null;
function hasRec(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function stopRec(){
  if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch(e){} }
  clearTimeout(recTimer);
  if (recStream) { recStream.getTracks().forEach(function(t){ t.stop(); }); recStream = null; }
  var rb = $('#rRec'); if (rb) { rb.classList.remove('on'); }
  var rl = $('#rRecLbl'); if (rl) rl.textContent = hasRec() ? '녹음/비교' : '녹음 불가';
}
function startRec(){
  if (!hasRec()) { toast('이 브라우저는 녹음을 지원하지 않아요 (Safari 최신 버전 권장)'); return; }
  stopAll();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}).then(function(st){
    recStream = st; recChunks = [];
    var mime = (window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : '';
    try { rec = mime ? new MediaRecorder(st, {mimeType:mime}) : new MediaRecorder(st); } catch(e){ rec = new MediaRecorder(st); }
    rec.ondataavailable = function(e){ if (e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop = function(){
      var blob = new Blob(recChunks, {type: (recChunks[0] && recChunks[0].type) || 'audio/mp4'});
      if (recUrl) URL.revokeObjectURL(recUrl);
      recUrl = URL.createObjectURL(blob);
      recCard = recOwner;
      var rl = $('#rRecLbl'); if (rl) rl.textContent = '내 목소리';
      var rw = $('#recbar'); if (rw) rw.innerHTML = '<span>녹음 완료</span><button id="playMine">▶ 내 목소리</button><button id="cmpBtn">⇄ 원어민과 비교</button><button id="reRec">● 다시</button>';
      var pm = $('#playMine'); if (pm) pm.onclick = function(){ playMine(pm); };
      var cb = $('#cmpBtn'); if (cb) cb.onclick = function(){ compare(); };
      var rr = $('#reRec'); if (rr) rr.onclick = function(){ recUrl = null; recCard = null; startRec(); };
    };
    rec.start();
    var rb = $('#rRec'); if (rb) rb.classList.add('on');
    var rl2 = $('#rRecLbl'); if (rl2) rl2.textContent = '■ 중지';
    recTimer = setTimeout(stopRec, 10000);
  }).catch(function(){ toast('마이크 권한이 필요합니다. 설정 > Safari > 마이크에서 허용해 주세요'); });
}
function playMine(btn){
  if (!recUrl) return;
  stopAll();
  var a = new Audio(recUrl); curA = a;
  if (btn) btn.classList.add('on');
  a.onended = function(){ if (btn) btn.classList.remove('on'); };
  a.play();
}
function compare(){
  if (!recUrl || !recCard) return;
  stopAll();
  var owner = recCard, url = recUrl;
  playFile('p_' + owner, function(){
    var a = new Audio(url); curA = a; a.play();
  }, {keep:true});
}

/* ═════════ card deck ═════════ */
var deck = [], di = 0, revealed = false;

function filtered(){
  var q = S.q.trim().toLowerCase();
  return DATA.phrases.filter(function(p){
    if (S.lv && p.lv !== S.lv) return false;
    if (!q) return true;
    return (p.ko + ' ' + p.jp + ' ' + p.kana + ' ' + p.tag + ' ' + p.ex + ' ' + p.note).toLowerCase().indexOf(q) >= 0;
  });
}
function cardById(id){ for (var i=0;i<DATA.phrases.length;i++) if (DATA.phrases[i].id === id) return DATA.phrases[i]; return null; }
function buildDeck(){
  var ids = filtered().map(function(p){ return p.id; });
  var cur = deck[di];
  deck = ids;
  di = (cur && ids.indexOf(cur) >= 0) ? ids.indexOf(cur) : 0;

         '<button class="explay" id="exPlay">🔊 예문 듣기</button></div>';
    h += '<div class="recbar" id="recbar">' + ((recUrl && recCard === p.id) ? '<span>녹음 완료</span><button id="playMine">▶ 내 목소리</button><button id="cmpBtn">⇄ 원어민과 비교</button>' : '녹음은 아래 🎙️ 버튼으로') + '</div>';

  $('#exPlay') && ($('#exPlay').onclick = function(){ playFile('e_' + p.id); });

  $('#doneBtn').onclick = function(){ S.done[p.id] = !S.done[p.id]; save(); renderDeck(); updateHead(); toast(S.done[p.id] ? '연습 완료로 표시했어요' : '완료를 해제했어요'); };

function setRemote(p){
  var rl = $('#rListenLbl'); if (rl) rl.textContent = rateLabel() + ' 듣기';
  var rb = $('#rLoop'); if (rb) rb.classList.remove('on');
  var lo = $('#rLoopLbl'); if (lo) lo.textContent = '따라말하기';
  var lbl = $('#rRecLbl'); if (lbl) lbl.textContent = hasRec() ? (recUrl ? '내 목소리' : '녹음/비교') : '녹음 불가';
  var rn = $('#rNext'); if (rn) rn.disabled = !p;
  window.__cur = p || null;
}
function currentCard(){ return window.__cur; }
function listen(){
  var p = currentCard(); if (!p) return;
  if (!revealed) { revealed = true; renderDeck(); }
  playFile('p_' + p.id);
}
function startLoop(){
  var p = currentCard(); if (!p) return;
  if (loopOn) { stopAll(); return; }
  if (!revealed) { revealed = true; renderDeck(); }
  loopOn = true;
  var btn = $('#rLoop'), lbl = $('#rLoopLbl');
  if (btn) btn.classList.add('on');
  var n = 0;
  var step = function(){
    if (!loopOn) return;
    n++;
    if (lbl) lbl.textContent = n + '/5 듣기';
    playFile('p_' + p.id, function(){
      if (!loopOn) return;
      var left = 3;
      if (lbl) lbl.textContent = left + '초 따라말하기';
      var tick = setInterval(function(){
        left--;
        if (!loopOn) { clearInterval(tick); return; }
        if (left > 0) { if (lbl) lbl.textContent = left + '초 따라말하기'; }
        else {
          clearInterval(tick);
          if (n >= 5) { stopAll(); toast('5회 완료 — 다음 카드로'); return; }
          step();
        }
      }, 1000);
    }, {keep:true});
  };
  step();
}
function recToggle(){
  if (rec && rec.state === 'recording') { stopRec(); return; }
  var p = currentCard(); if (!p) return;
  if (!revealed) { revealed = true; renderDeck(); }
  recOwner = p.id;
  if (recUrl && recCard === p.id) { compare(); return; }   // this card already recorded: native ↔ mine
  recUrl = null; recCard = null;
  startRec();
}

function playSeq(d, arr, k){

  } else {
    h += '<div class="answer"><div class="ajp jp">' + (S.furi ? p.ruby : esc(p.jp)) + '</div>';
    h += '<div class="akana jp">' + esc(p.kana) + '</div><div class="aroma">' + esc(romaji(p.kana)) + '</div>';
    h += '<div class="note">💡 ' + esc(p.note) + '</div></div>';
    h += '<div class="krow"><button class="btn pri" id="dSpk">🔊 ' + rateLabel() + ' 듣기</button><button class="btn" id="dAgain">🗣 다시 말하기</button><button class="btn' + (S.saved[p.id]?' on':'') + '" id="dSave">' + (S.saved[p.id] ? '★' : '☆') + '</button></div>';
  }
  h += '</div></div>';
  h += '<div class="krow"><button class="btn" id="dPrev">← 이전</button><button class="btn pri" id="dNext">' + (D.i === 9 ? '드릴 완료' : '다음 →') + '</button></div>';
  if (D.done) h += '<div class="empty" style="padding:18px 0">🎉 오늘의 드릴 10문장 완료!<br><button class="btn pri" id="dRestart" style="margin-top:12px">새 드릴 시작</button></div>';
  host.innerHTML = h;
  $('#dRev') && ($('#dRev').onclick = function(){ D.rev = true; save(); renderDrill(); });
  $('#dSpk') && ($('#dSpk').onclick = function(){ playFile('p_' + p.id); });
  $('#dAgain') && ($('#dAgain').onclick = function(){ D.rev = false; save(); renderDrill(); });
  $('#dSave') && ($('#dSave').onclick = function(){ S.saved[p.id] = !S.saved[p.id]; save(); renderDrill(); updateHead(); });
  $('#dPrev').onclick = function(){ if (D.i>0){ D.i--; D.rev=false; stopAll(); save(); renderDrill(); } };
  $('#dNext').onclick = function(){
    S.done[p.id] = true; save(); updateHead();
    if (D.i < 9) { D.i++; D.rev=false; stopAll(); save(); renderDrill(); }
    else { D.done = true; save(); renderDrill(); toast('드릴 10문장 완료!'); }
  };
  $('#reDrill').onclick = function(){ stopAll(); startDrill(); };
  $('#dRestart') && ($('#dRestart').onclick = function(){ stopAll(); startDrill(); });
}

/* ═════════ saved ═════════ */
function renderSaved(){
  var host = $('#savedWrap');
  var ids = Object.keys(S.saved).filter(function(k){ return S.saved[k]; });
  if (!ids.length) { host.innerHTML = '<div class="empty">저장한 표현이 없어요.<br>카드 상단 ☆ 버튼으로 담아 두세요.</div>'; return; }
  var h = '<h2 class="sec">저장함 <small>' + ids.length + '개</small></h2><div class="dlist">';
  ids.forEach(function(id){
    var p = cardById(id); if (!p) return;
    h += '<div class="card ditem"><div class="dnum">Lv' + p.lv + '</div><div style="min-width:0;flex:1">';
    h += '<div class="dt jp">' + (S.furi ? p.ruby : esc(p.jp)) + '</div><div class="ds">' + esc(p.ko) + '</div></div>';
    h += '<button class="ico" data-p="' + id + '">🔊</button>';
    h += '<button class="ico" data-u="' + id + '" style="margin-left:5px">✕</button></div>';
  });
  h += '</div>';
  host.innerHTML = h;
  host.querySelectorAll('[data-p]').forEach(function(b){ b.onclick = function(){ playFile('p_' + b.dataset.p); }; });
  host.querySelectorAll('[data-u]').forEach(function(b){ b.onclick = function(){ S.saved[b.dataset.u] = false; save(); renderSaved(); updateHead(); }; });
}

/* ═════════ tips ═════════ */
function renderTips(){
  var M = DATA.meta, h = '';
  h += '<h2 class="sec">훈련법 <small>5단계</small></h2><div class="card" style="padding:4px 14px">';
  M.method.forEach(function(m){ h += '<div class="mitem"><div class="mnum">' + m.n + '</div><div><b>' + esc(m.t) + '</b><p>' + esc(m.d) + '</p></div></div>'; });
  h += '</div>';
  var cats = [], byCat = {};
  M.tips.forEach(function(t){ if (!byCat[t.cat]) { byCat[t.cat] = []; cats.push(t.cat); } byCat[t.cat].push(t); });
  cats.forEach(function(c){
    h += '<h3>' + esc(c) + '</h3><div class="card" style="padding:2px 14px">';
    byCat[c].forEach(function(t){
      h += '<div class="tip"><b>' + esc(t.t) + '</b><p>' + esc(t.d) + '</p><a href="' + t.src + '" target="_blank" rel="noopener">↗ ' + esc(t.srcName) + '</a></div>';
    });
    h += '</div>';
  });
  h += '<h3>수집 출처</h3><div class="card" style="padding:2px 14px">';
  M.sources.forEach(function(s){ h += '<div class="srcline"><b>' + esc(s.k) + '</b><a href="' + s.u + '" target="_blank" rel="noopener">' + esc(s.n) + '</a></div>'; });
  h += '</div>';
  h += '<h3>수집 한계 (정직 고지)</h3><div class="card" style="padding:2px 14px">';
  M.limits.forEach(function(l){ h += '<div class="warn">· ' + esc(l) + '</div>'; });
  h += '</div>';
  h += '<h3>아이폰 홈 화면에 추가</h3><div class="card" style="padding:4px 14px"><div class="tip"><p>Safari에서 이 페이지를 연 뒤 <b>공유(□↑) → 홈 화면에 추가</b>. 음성은 사전 녹음된 MP3라 아이폰 무음 모드에서도 재생됩니다.</p></div></div>';
  $('#tipsWrap').innerHTML = h;
}

/* ═════════ settings sheet ═════════ */
function buildSheet(){
  var lvName = {0:'전체',1:'Lv.1 유행·SNS',2:'Lv.2 일상',3:'Lv.3 직장',4:'Lv.4 상담',5:'Lv.5 심화'};
  $('#lvchips').innerHTML = [0,1,2,3,4,5].map(function(v){
    return '<button class="chip' + (S.lv===v?' on':'') + '" data-lv="' + v + '">' + lvName[v] + '</button>';
  }).join('');
  $('#lvchips').querySelectorAll('.chip').forEach(function(c){
    c.onclick = function(){
      S.lv = +c.dataset.lv; save(); buildSheet(); updateHead();
      if (S.tab === 'drill') { S.drill = null; startDrill(); }
      if (S.tab === 'card') buildDeck();
      renderDeckCount();
    };
  });
  $('#rateBox').innerHTML = RATES.map(function(r){
    return '<button data-r="' + r + '" class="' + (Math.abs(S.rate-r)<.01?'on':'') + '">' + r + 'x</button>';
  }).join('');
  $('#rateBox').querySelectorAll('button').forEach(function(b){
    b.onclick = function(){ S.rate = parseFloat(b.dataset.r); save(); buildSheet(); setRemote(currentCard()); if (S.tab==='card') renderDeck(); if (openD) openDialogue(openD.id); };
  });
  $('#furiSw').classList.toggle('on', S.furi);
  $('#polSw').classList.toggle('on', S.pol);
  $('#sfoot').innerHTML = '완료 ' + Object.keys(S.done).filter(function(k){return S.done[k];}).length + ' / ' + DATA.phrases.length +
    ' · 저장 ' + Object.keys(S.saved).filter(function(k){return S.saved[k];}).length + '개<br>진행 상황은 이 기기에만 저장됩니다.';
}
function renderDeckCount(){ var el=$('#hlv'); if (!el) return; el.textContent = S.lv ? ('Lv.' + S.lv) : '전체'; }
function openSheet(){ buildSheet(); $('#sheetWrap').classList.add('on'); }
function closeSheet(){ $('#sheetWrap').classList.remove('on'); }

/* ═════════ head / tabs ═════════ */
function updateHead(){
  var total = DATA.phrases.length;
  var n = DATA.phrases.filter(function(p){ return S.done[p.id]; }).length;
  $('#doneN').textContent = n; $('#doneT').textContent = '/' + total;
  $('#hbar').style.width = (n / total * 100) + '%';
  renderDeckCount();
}
function setTab(t){
  S.tab = t; save();
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === t); });
  document.querySelectorAll('.tab').forEach(function(s){ s.classList.remove('on'); });
  $('#tab-' + t).classList.add('on');
  document.body.classList.toggle('tab-card', t === 'card');
  stopAll();
  if (t === 'card') renderDeck();
  if (t === 'role') renderRoleList();
  if (t === 'drill') { if (!S.drill) startDrill(); else renderDrill(); }
  if (t === 'saved') renderSaved();
  if (t === 'tips') renderTips();
  window.scrollTo(0, 0);
}

/* ═════════ init ═════════ */
document.body.classList.toggle('nofuri', !S.furi);
$('#setBtn').onclick = openSheet;
$('#sheetBack').onclick = closeSheet;
$('#sheetClose').onclick = closeSheet;
$('#furiSw').onclick = function(){ S.furi = !S.furi; save(); document.body.classList.toggle('nofuri', !S.furi); buildSheet(); if (S.tab==='card') renderDeck(); if (openD && $('#roleView').style.display !== 'none') openDialogue(openD.id); };
$('#polSw').onclick = function(){ S.pol = !S.pol; save(); buildSheet(); if (S.tab==='card') renderDeck(); };
$('#q').value = S.q || '';
var qi;
$('#q').oninput = function(e){ clearTimeout(qi); var v = e.target.value; qi = setTimeout(function(){ S.q = v; save(); if (S.tab==='card') buildDeck(); renderDeckCount(); }, 220); };

$('#rListen').onclick = listen;
$('#rLoop').onclick = startLoop;
$('#rRec').onclick = recToggle;
$('#rNext').onclick = function(){
  if (di < deck.length-1) { di++; revealed=false; stopAll(); renderDeck(); window.scrollTo({top:0,behavior:'smooth'}); }
  else toast('마지막 카드예요');
};
document.querySelectorAll('nav button').forEach(function(b){ b.onclick = function(){ setTab(b.dataset.tab); }; });

buildDeck(); updateHead(); setRemote(currentCard());
if (S.rate) { /* stored, keep */ }
if (S.tab && S.tab !== 'card') setTab(S.tab);

// swipe on the deck
var sx = 0, sy = 0;
$('#deck').addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$('#deck').addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 55 || Math.abs(dy) > 45) return;
  if (dx < 0 && di < deck.length-1) { di++; revealed=false; stopAll(); renderDeck(); }
  if (dx > 0 && di > 0) { di--; revealed=false; stopAll(); renderDeck(); }
}, {passive:true});
</script>
</body>
</html>
